<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}header{background:#14213d;color:white;padding:20px}header div,main{max-width:1000px;margin:auto}h1{margin:0;font-size:28px}.tag{color:#d5e1ff;font-size:13px;margin-top:5px}main{padding:18px 12px}.paper{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:clamp(14px,3vw,28px)}.section{font-weight:bold;margin:6px 0 12px}.meta{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:22px}label{display:block;color:#64748b;font-size:13px;font-weight:bold;margin-bottom:6px}input{width:100%;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:9px 7px;border-bottom:1px solid #dbe3ef}th{text-align:left;background:#f0f4fb;font-size:12px;color:#475569}th.num,td.num,.line-total{text-align:right}td input{padding:9px 6px}.line-total{white-space:nowrap;font-weight:bold}.table-wrap{overflow-x:auto}button{border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#2457d6;color:white}.secondary{background:#e8eef9;color:#1e3a70}.dark{background:#14213d;color:white}.remove{background:#fff0f0;color:#b42318;padding:8px 10px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.summary{width:min(100%,360px);margin:22px 0 0 auto}.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #dbe3ef}.total{font-size:21px;font-weight:800;border:0}.note{font-size:12px;color:#64748b;margin-top:22px}@media(max-width:600px){.meta{grid-template-columns:1fr}h1{font-size:24px}}@media print{@page{size:A4;margin:12mm}body{background:white;font-size:12px}header{background:white;color:black;padding:0 0 12px;border-bottom:2px solid black}.tag{color:#444}main{padding:0}.paper{border:0;padding:12px 0}.no-print{display:none!important}.meta{margin-bottom:12px}input{border:0;padding:2px 0;background:transparent}table{min-width:0}th,td{padding:7px 4px}th{background:#eee}.table-wrap{overflow:visible}.summary{break-inside:avoid}}
</style></head><body>
<header><div><h1>Invoice</h1><div class="tag">Simple, fast and print-ready bill</div></div></header>
<main><section class="paper">
<div class="section">Bill details</div><div class="meta"><div><label for="customer">Name / Customer</label><input id="customer" placeholder="Enter customer or business name"></div><div><label for="date">Date</label><input id="date" type="date"></div></div>
<div class="section">Items</div><div class="table-wrap"><table><thead><tr><th style="width:40%">Item / Description</th><th class="num">Quantity</th><th class="num">Amount (₹)</th><th class="num">Line total</th><th class="no-print"></th></tr></thead><tbody id="items"></tbody></table></div>
<div class="actions no-print"><button class="primary" id="add">＋ Add Item</button><button class="secondary" id="clear">Clear Items</button></div>
<div class="summary"><div class="sumrow"><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div><div class="sumrow total"><span>Overall Total</span><span id="total">₹0.00</span></div><div class="tag">Currency: Indian Rupee (INR)</div></div>
<div class="actions no-print"><button class="dark" id="print">🖨 Print Bill</button><button class="secondary" id="new">New Bill</button></div>
<p class="note">Check all quantities and amounts before printing. In the print dialog, you can print the bill or save it as a PDF.</p>
</section></main>
<script>
const tbody=document.getElementById('items');
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n||0);
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
document.getElementById('date').value=today();
function addRow(desc='',qty=1,price=''){let tr=document.createElement('tr');tr.innerHTML='<td><input class="desc" aria-label="Item description" placeholder="Item name"></td><td><input class="qty" aria-label="Quantity" type="number" min="0" step="any" inputmode="decimal"></td><td><input class="price" aria-label="Amount per item" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></td><td class="line-total">₹0.00</td><td class="no-print"><button type="button" class="remove" aria-label="Remove item">✕</button></td>';tr.querySelector('.desc').value=desc;tr.querySelector('.qty').value=qty;tr.querySelector('.price').value=price;tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',calculate));tr.querySelector('.remove').onclick=()=>{tr.remove();if(!tbody.children.length)addRow();calculate()};tbody.appendChild(tr);calculate()}
function calculate(){let total=0;[...tbody.rows].forEach(tr=>{let q=Math.max(0,Number(tr.querySelector('.qty').value)||0),p=Math.max(0,Number(tr.querySelector('.price').value)||0),v=q*p;total+=v;tr.querySelector('.line-total').textContent=money(v)});document.getElementById('subtotal').textContent=money(total);document.getElementById('total').textContent=money(total)}
document.getElementById('add').onclick=()=>{addRow();tbody.lastElementChild.querySelector('.desc').focus()};
document.getElementById('clear').onclick=()=>{tbody.innerHTML='';addRow()};
document.getElementById('print').onclick=()=>window.print();
document.getElementById('new').onclick=()=>{document.getElementById('customer').value='';document.getElementById('date').value=today();tbody.innerHTML='';addRow();addRow();document.getElementById('customer').focus()};
addRow();addRow();
</script></body></html>
