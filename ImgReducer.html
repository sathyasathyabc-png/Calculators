<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Size Reducer</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:900px;margin:0 auto;padding:32px 18px 50px}
header{text-align:center;margin-bottom:25px}
h1{margin:0 0 8px;font-size:30px}.subtitle{color:var(--muted);margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 8px 30px #1d355710}
.drop{border:2px dashed #b9c2d0;border-radius:15px;padding:42px 20px;text-align:center;cursor:pointer;background:#fbfcfe;transition:.2s}
.drop:hover,.drop.drag{border-color:var(--accent);background:#f5f8ff}
.icon{font-size:44px;margin-bottom:10px}.drop strong{display:block;font-size:17px}.drop span{display:block;color:var(--muted);font-size:13px;margin-top:7px}
input[type=file]{display:block;width:100%;margin-top:14px;padding:10px;border:1px solid #d5d9e2;border-radius:9px;background:#fff;color:#344054;cursor:pointer}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.control{border:1px solid var(--line);border-radius:12px;padding:15px}
.control label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=number]{width:100%;padding:10px;border:1px solid #d5d9e2;border-radius:9px;background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button,.download{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:14px}
.primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}
.secondary{background:#eef2f7;color:#344054}.primary:disabled{opacity:.5;cursor:not-allowed}
.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:18px;display:none}.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.status{margin-top:12px;color:var(--muted);font-size:13px;min-height:18px}
.results{margin-top:18px;display:grid;gap:10px}
.result{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px}
.result b{display:block;margin-bottom:5px}.result small{color:var(--muted)}
.download{display:inline-block;text-decoration:none;margin-top:10px;padding:9px 13px}
.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
@media(max-width:700px){.controls{grid-template-columns:1fr}.container{padding:20px 12px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🖼 Image Size Reducer</h1>
<p class="subtitle">Compress and resize images directly on your computer</p>
</header>

<div class="card">
<div class="drop" id="drop">
<div class="icon">🖼️</div>
<strong>Drop images here</strong>
<span>Drag and drop files here, or use the file picker below</span>
<input id="input" type="file" accept="image/*,.jpg,.jpeg,.png,.webp" multiple>
</div>

<div class="controls">
<div class="control">
<label>Quality <span id="qualityValue">75%</span></label>
<input id="quality" type="range" min="10" max="100" value="75">
</div>
<div class="control">
<label>Output format</label>
<select id="format">
<option value="image/jpeg">JPG — best for photos</option>
<option value="image/webp">WebP — smaller modern format</option>
<option value="image/png">PNG — lossless</option>
</select>
</div>
<div class="control">
<label>Maximum width <span>px</span></label>
<input id="maxWidth" type="number" min="100" step="100" placeholder="Original size">
</div>
<div class="control">
<label>Maximum height <span>px</span></label>
<input id="maxHeight" type="number" min="100" step="100" placeholder="Original size">
</div>
</div>

<div class="actions">
<button class="primary" id="compress" disabled>Compress Images</button>
<button class="secondary" id="clear">Clear</button>
</div>
<div class="progress" id="progress"><div></div></div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
<div class="note">🔒 Privacy: images are processed entirely in your browser. They are not uploaded to a server.</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const formatBytes=n=>{
 if(!n)return"0 B";
 const units=["B","KB","MB","GB"];let i=0;
 while(n>=1024&&i<units.length-1){n/=1024;i++}
 return n.toFixed(i?2:0)+" "+units[i];
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let files=[];

$("quality").oninput=()=>$("qualityValue").textContent=$("quality").value+"%";

function chooseFiles(list){
 const allowed=/\.(jpe?g|png|webp)$/i;
 files=[...list].filter(f=>{
   const typeOk=/^image\/(jpeg|png|webp)$/i.test(f.type || "");
   const extOk=allowed.test(f.name || "");
   return typeOk || extOk;
 });
 $("compress").disabled = files.length === 0;
 $("compress").style.opacity = files.length ? "1" : ".5";
 $("status").textContent=files.length
   ? files.length+" image(s) selected."
   : "No supported images selected. Please choose JPG, JPEG, PNG, or WebP.";
 $("results").innerHTML="";
 if(files.length){
   $("results").innerHTML = '<div class="result"><b>Ready to compress</b><small>'+files.length+' image(s) selected</small></div>';
 }
}
$("input").addEventListener("change",function(e){
  chooseFiles(e.target.files);
});

["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{
 e.preventDefault();$("drop").classList.add("drag");
}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{
 e.preventDefault();$("drop").classList.remove("drag");
}));
$("drop").addEventListener("drop",e=>{
  e.preventDefault();
  chooseFiles(e.dataTransfer.files);
});

$("clear").onclick=()=>{
 files=[];$("input").value="";$("compress").disabled=true;
 $("status").textContent="";$("results").innerHTML="";
 $("progress").style.display="none";
};

function loadImage(file){
 return new Promise((resolve,reject)=>{
   const img=new Image();
   const url=URL.createObjectURL(file);
   img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
   img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Could not read image"))};
   img.src=url;
 });
}
function toBlob(canvas,type,quality){
 return new Promise((resolve,reject)=>{
   canvas.toBlob(b=>b?resolve(b):reject(new Error("Browser could not create output image")),type,quality);
 });
}

$("compress").onclick=async()=>{
 if(!files.length)return;
 const quality=+$("quality").value/100;
 const type=$("format").value;
 const maxW=parseInt($("maxWidth").value)||Infinity;
 const maxH=parseInt($("maxHeight").value)||Infinity;
 const bar=$("progress").firstElementChild;
 $("progress").style.display="block";
 $("compress").disabled=true;
 $("results").innerHTML="";
 let totalBefore=0,totalAfter=0;

 for(let i=0;i<files.length;i++){
   const file=files[i];
   totalBefore+=file.size;
   $("status").textContent="Compressing "+(i+1)+" of "+files.length+" — "+file.name;
   try{
     const img=await loadImage(file);
     let scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
     const w=Math.max(1,Math.round(img.naturalWidth*scale));
     const h=Math.max(1,Math.round(img.naturalHeight*scale));
     const canvas=document.createElement("canvas");
     canvas.width=w;canvas.height=h;
     const ctx=canvas.getContext("2d");
     if(type==="image/jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h)}
     ctx.imageSmoothingEnabled=true;
     ctx.imageSmoothingQuality="high";
     ctx.drawImage(img,0,0,w,h);

     const blob=await toBlob(canvas,type,quality);
     totalAfter+=blob.size;
     const ext=type==="image/png"?"png":type==="image/webp"?"webp":"jpg";
     const base=file.name.replace(/\\.[^.]+$/,"");
     const outputName=base+"-compressed."+ext;
     const url=URL.createObjectURL(blob);
     const reduction=(1-blob.size/file.size)*100;

     $("results").insertAdjacentHTML("beforeend",
       '<div class="result">'+
       '<b>'+esc(outputName)+'</b>'+
       '<small>'+formatBytes(file.size)+' → '+formatBytes(blob.size)+' · '+
       (reduction>=0?reduction.toFixed(1)+'% smaller':Math.abs(reduction).toFixed(1)+'% larger')+
       ' · '+w+' × '+h+' px</small><br>'+
       '<a class="download primary" href="'+url+'" download="'+esc(outputName)+'">Download</a>'+
       '</div>');
   }catch(err){
     $("results").insertAdjacentHTML("beforeend",
       '<div class="result"><b style="color:#dc2626">Failed: '+esc(file.name)+'</b><small>'+esc(err.message)+'</small></div>');
   }
   bar.style.width=((i+1)/files.length*100)+"%";
   await new Promise(r=>setTimeout(r,10));
 }
 const reduction=totalBefore?((1-totalAfter/totalBefore)*100):0;
 $("status").textContent="Finished — "+formatBytes(totalBefore)+" → "+formatBytes(totalAfter)+
   " ("+(reduction>=0?reduction.toFixed(1)+"% smaller":Math.abs(reduction).toFixed(1)+"% larger")+").";
 $("compress").disabled=false;
};
</script>
</body>
</html>
