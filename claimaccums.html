<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facets & Accumulator Learning Workbench</title>
<style>
:root{--navy:#14263d;--navy2:#1c3552;--blue:#2767a8;--cyan:#27a6b8;--bg:#f3f6fa;--card:#fff;--text:#1d2b3a;--muted:#65758a;--line:#dce4ed;--green:#16845b;--red:#b94b50;--amber:#a86a12;--shadow:0 5px 20px #18314b0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 13px;background:var(--blue);color:white;font-weight:600}button:hover{filter:brightness(.95)}button.secondary{background:#eaf0f6;color:#29425e}button.ghost{background:transparent;color:#31516f;border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red);border:1px solid #f0cccc}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#e9f1fa;padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 23px;border-bottom:1px solid #ffffff20}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#39b6c6,#3479bd);display:grid;place-items:center;font-weight:800;font-size:18px}.brand strong{display:block;font-size:15px}.brand small{color:#a9bfd5}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#89a2bc;margin:23px 10px 8px}.nav button{width:100%;display:flex;gap:11px;align-items:center;text-align:left;background:transparent;color:#c8d6e5;padding:10px 12px;margin:2px 0;font-weight:500}.nav button.active,.nav button:hover{background:#ffffff17;color:white}.nav .ico{width:20px;text-align:center}.sidebar-foot{font-size:11px;color:#91a9c1;border-top:1px solid #ffffff20;padding:15px 8px;margin-top:25px}.main{min-width:0}.topbar{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-weight:650}.top-actions{display:flex;gap:9px;align-items:center}.pill{font-size:11px;padding:4px 8px;border-radius:30px;background:#eaf5f6;color:#187687;font-weight:700}.content{padding:28px 30px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.pagehead h1{font-size:25px;margin:0 0 5px;color:#172d45}.sub{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat{display:flex;justify-content:space-between;align-items:center}.stat .num{font-size:27px;font-weight:750;color:#173653}.stat small{color:var(--muted)}.stat-icon{width:39px;height:39px;border-radius:11px;background:#edf4fb;display:grid;place-items:center;font-size:19px}.card h3{margin:0 0 14px;font-size:15px;color:#213b56}.card h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf1f5}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#718197;background:#f8fafc}td{font-size:13px}.status{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700;background:#e8f6ef;color:var(--green)}.status.warn{background:#fff4df;color:var(--amber)}.status.bad{background:#ffeded;color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650;color:#52657a}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd9e4;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text)}.field textarea{min-height:120px;font-family:Consolas,monospace}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.notice{padding:12px 14px;border-radius:9px;background:#edf5fc;color:#315878;border:1px solid #d8e8f5;margin:12px 0}.notice.warn{background:#fff7e9;border-color:#f1dfba;color:#815715}.notice.good{background:#ebf7f0;border-color:#cce8d8;color:#176442}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button{background:#edf2f7;color:#476078}.tabs button.active{background:var(--navy2);color:white}.bar{height:9px;background:#edf1f5;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#2b83b9,#35b5b6)}.lesson{border:1px solid var(--line);border-radius:10px;padding:14px;margin:9px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;background:white}.lesson.done{border-color:#bfe2cf;background:#f7fcf9}.lesson strong{display:block}.lesson small{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.jsonarea{width:100%;min-height:420px;font:12px/1.5 Consolas,monospace;border:1px solid #cbd6e2;border-radius:9px;padding:13px;background:#fbfcfe}.resultbox{background:#f7fafc;border:1px solid var(--line);padding:13px;border-radius:9px}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.resultgrid div{background:white;border:1px solid var(--line);padding:12px;border-radius:8px}.resultgrid b{display:block;font-size:20px}.modalback{position:fixed;inset:0;background:#10223880;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;border-radius:14px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{margin:0}.toast{position:fixed;right:22px;bottom:22px;background:#18344f;color:white;padding:12px 17px;border-radius:9px;z-index:30;box-shadow:var(--shadow)}.footerhint{font-size:11px;color:var(--muted);margin-top:18px}.mobilemenu{display:none}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;width:250px;z-index:15;transition:left .2s}.sidebar.open{left:0}.mobilemenu{display:inline-block}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:600px){.content{padding:15px}.topbar{padding:0 14px}.stats,.three,.formgrid,.resultgrid{grid-template-columns:1fr}.pagehead{display:block}.pagehead .actions{margin-top:12px}}

.tour-backdrop{position:fixed;inset:0;background:rgba(9,24,40,.62);z-index:40;display:grid;place-items:center;padding:18px}
.tour-panel{width:min(520px,100%);background:#fff;border-radius:16px;padding:24px;box-shadow:0 24px 80px #07172766;position:relative}
.tour-kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#23859b;font-weight:800}
.tour-panel h2{font-size:22px;margin:8px 0;color:#17334f}
.tour-panel p{color:#5f7185;line-height:1.65;margin:8px 0 18px}
.tour-progress{height:5px;background:#eaf0f5;border-radius:9px;overflow:hidden;margin:14px 0 18px}
.tour-progress span{display:block;height:100%;background:linear-gradient(90deg,#2767a8,#27a6b8)}
.tour-actions{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tour-actions .right{display:flex;gap:8px}
.tour-focus{position:relative!important;z-index:41!important;outline:3px solid #32b8c6!important;outline-offset:4px!important;box-shadow:0 0 0 8px rgba(50,184,198,.18)!important;border-radius:8px!important}
.tour-welcome-icon{width:54px;height:54px;border-radius:15px;background:#e8f5f7;color:#16798a;display:grid;place-items:center;font-size:26px}
@media(max-width:600px){.tour-panel{padding:19px}.tour-panel h2{font-size:19px}}

</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">F</div><div><strong>Facets Learning</strong><small>Claims & Accumulator Lab</small></div></div>
 <nav class="nav">
  <div class="navlabel">Workspace</div>
  <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
  <button data-page="learning"><span class="ico">▤</span>Learning center</button>
  <div class="navlabel">Healthcare data</div>
  <button data-page="members"><span class="ico">♙</span>Members & enrollment</button>
  <button data-page="providers"><span class="ico">✚</span>Providers & networks</button>
  <button data-page="plans"><span class="ico">◇</span>Benefits & plans</button>
  <button data-page="claims"><span class="ico">▣</span>Claims processing</button>
  <button data-page="accumulators"><span class="ico">◷</span>Accumulators</button>
  <div class="navlabel">Tools</div>
  <button data-page="workbench"><span class="ico">{ }</span>JSON workbench</button>
  <button data-page="reports"><span class="ico">▥</span>Reports & history</button>
 </nav>
 <div class="sidebar-foot">Educational simulator · Not connected to a live Facets environment</div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobilemenu" id="menuBtn">☰</button><span class="crumb" id="crumb">Dashboard</span></div><div class="top-actions"><span class="pill">TRAINING MODE</span><button class="ghost" id="tourTop" type="button">ⓘ Take a tour</button><button class="secondary" id="exportTop">Export JSON</button></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div><div id="tourRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
const KEY='facets_learning_workbench_v1';
const seed={
 members:[
  {id:'M1001',firstName:'John',lastName:'Smith',dob:'1988-04-12',status:'Active',planId:'GOLD',effective:'2026-01-01',termination:'',familyId:'F100',relationship:'Subscriber'},
  {id:'M1002',firstName:'Emma',lastName:'Smith',dob:'1990-08-20',status:'Active',planId:'GOLD',effective:'2026-01-01',termination:'',familyId:'F100',relationship:'Spouse'},
  {id:'M2001',firstName:'David',lastName:'Miller',dob:'1979-02-03',status:'Active',planId:'SILVER',effective:'2026-01-01',termination:'',familyId:'F200',relationship:'Subscriber'}
 ],
 providers:[
  {id:'P101',name:'City Hospital',type:'Institutional',network:'IN',status:'Active',tin:'11-1111111'},
  {id:'P102',name:'Metro Medical Group',type:'Professional',network:'IN',status:'Active',tin:'22-2222222'},
  {id:'P201',name:'Lakeside Clinic',type:'Professional',network:'OUT',status:'Active',tin:'33-3333333'}
 ],
 plans:[
  {id:'GOLD',name:'Gold Health Plan',deductible:1000,familyDeductible:2000,copay:30,coinsurance:20,oopMax:5000,familyOopMax:10000,inNetwork:true,outNetworkCoinsurance:40,annualVisitLimit:20},
  {id:'SILVER',name:'Silver Health Plan',deductible:2000,familyDeductible:4000,copay:40,coinsurance:30,oopMax:6000,familyOopMax:12000,inNetwork:true,outNetworkCoinsurance:50,annualVisitLimit:15}
 ],
 claims:[],accumulatorTransactions:[],processed:[],lessonsCompleted:[]
};
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.members&&x.plans)return x}catch(e){}return structuredClone(seed)}
function save(){localStorage.setItem(KEY,JSON.stringify(db));updateCounts()}
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>r.innerHTML='',2600)}
function updateCounts(){}
function page(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.getElementById('crumb').textContent=({dashboard:'Dashboard',learning:'Learning center',members:'Members & enrollment',providers:'Providers & networks',plans:'Benefits & plans',claims:'Claims processing',accumulators:'Accumulators',workbench:'JSON workbench',reports:'Reports & history'})[name];document.getElementById('sidebar').classList.remove('open');render(name)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('exportTop').onclick=exportJSON;
function head(title,sub,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`}
function stat(label,num,icon,detail=''){return `<div class="card stat"><div><small>${label}</small><div class="num">${num}</div><small>${detail}</small></div><div class="stat-icon">${icon}</div></div>`}
function render(p='dashboard'){const v=document.getElementById('view');v.innerHTML=({dashboard:dashboard,learning:learning,members:members,providers:providers,plans:plans,claims:claims,accumulators:accumulators,workbench:workbench,reports:reports}[p])()}
function dashboard(){const processed=db.processed.length,paid=db.processed.reduce((s,x)=>s+x.payerPaid,0),used=db.accumulatorTransactions.filter(x=>!x.reversed).reduce((s,x)=>s+x.memberAmount,0);return head('Healthcare administration overview','A connected training environment for payer operations and claim adjudication.',`<button onclick="page('claims')">＋ New claim</button> <button class="secondary" onclick="page('workbench')">Open JSON workbench</button>`)+
 `<div class="grid stats">${stat('Members',db.members.length,'♙','Enrollment records')}${stat('Providers',db.providers.length,'✚','Provider records')}${stat('Plans',db.plans.length,'◇','Benefit configurations')}${stat('Processed claims',processed,'▣','Adjudication runs')}</div>
 <div class="grid two"><div class="card"><h3>Learning journey</h3><p class="muted">Complete the lessons as you explore the simulator.</p><div class="bar"><span style="width:${db.lessonsCompleted.length/lessons.length*100}%"></span></div><p><b>${db.lessonsCompleted.length} of ${lessons.length}</b> lessons completed</p><button class="secondary" onclick="page('learning')">Continue learning</button></div>
 <div class="card"><h3>Training environment</h3><div class="resultgrid"><div><small class="muted">Illustrative payer paid</small><b>${money(paid)}</b></div><div><small class="muted">Accumulated member cost share</small><b>${money(used)}</b></div><div><small class="muted">Claim runs</small><b>${processed}</b></div></div></div></div>
 <div class="grid two" style="margin-top:16px"><div class="card"><h3>Recent claim activity</h3>${recentTable(5)}</div><div class="card"><h3>Explore modules</h3><div class="lesson" onclick="page('members')"><div><strong>Member & enrollment</strong><small>Eligibility, plan assignment and family grouping</small></div>→</div><div class="lesson" onclick="page('plans')"><div><strong>Benefits & plans</strong><small>Cost-sharing and plan rules</small></div>→</div><div class="lesson" onclick="page('accumulators')"><div><strong>Accumulator lab</strong><small>Deductible and OOP progression</small></div>→</div></div></div>
 <p class="footerhint">All records are local sample data. This workbench demonstrates general payer concepts and does not reproduce proprietary Facets screens, APIs, schemas or adjudication logic.</p>`}
const lessons=[
 {id:'l1',title:'Healthcare payer ecosystem',desc:'Payer, member, employer, provider and claim.',body:'A payer is the health plan or insurer responsible for administering coverage. A member is an individual covered by a plan. A provider delivers care, and a claim is a request for payment for services. An employer may sponsor coverage for employees.'},
 {id:'l2',title:'Facets and functional modules',desc:'Understand the role of a core administration platform.',body:'Facets is a healthcare payer administration platform. Implementations commonly support member/enrollment, provider, benefit, claims and financial workflows. Exact module names, screens and architecture vary by implementation and payer configuration.'},
 {id:'l3',title:'Member and eligibility',desc:'Coverage spans, effective dates and eligibility checks.',body:'Eligibility is evaluated for the date of service. A member may be active today but not covered on an earlier service date. Effective and termination dates, product enrollment and dependent relationships can affect claim processing.'},
 {id:'l4',title:'Provider and network',desc:'Contracted providers, network status and allowed amounts.',body:'A provider may participate in one or more networks. Network status is evaluated using payer contract and service-date rules. In-network and out-of-network benefits may have different deductibles, coinsurance and allowed amounts.'},
 {id:'l5',title:'Benefits and cost sharing',desc:'Deductible, copay, coinsurance and plan limits.',body:'A benefit defines whether a service is covered and the member cost sharing. A deductible is a member-paid amount before certain plan payments begin. Copay is usually a fixed amount; coinsurance is a percentage. Actual order and applicability depend on plan rules.'},
 {id:'l6',title:'Claim lifecycle',desc:'Intake, validation, pricing, adjudication and payment.',body:'A claim is received, checked for data and eligibility, matched to provider and benefit rules, priced, adjudicated and then finalized for payment or denial. Adjustments and reversals may change prior results.'},
 {id:'l7',title:'Accumulator fundamentals',desc:'Track deductible and out-of-pocket spending over time.',body:'An accumulator tracks qualifying member cost sharing against a plan-year or benefit-period limit. Claims can consume deductible and OOP balances. Which amounts count, which accumulator is used, and when it updates depend on benefit design.'},
 {id:'l8',title:'Family accumulators',desc:'Individual and family thresholds and embedded limits.',body:'A family plan may have both individual and family accumulators. An embedded individual limit can cap one person’s cost sharing even before the family total reaches its limit. Non-embedded designs work differently.'},
 {id:'l9',title:'Adjustments and reversals',desc:'Understand why accumulator balances can move backwards.',body:'If a processed claim is reversed or adjusted, its prior accumulator contribution may need to be removed or recalculated. Always consider claim version, original transaction linkage, effective date and re-adjudication rules.'},
 {id:'l10',title:'Troubleshooting a claim',desc:'Trace eligibility, provider, benefit and accumulator outcomes.',body:'A disciplined investigation starts with the claim and service date, then checks member coverage, provider/network, benefit configuration, pricing, cost-share calculation and accumulator history. Compare expected and actual results.'}
];
function learning(){return head('Learning center','Short lessons linked to practical examples in the workbench.')+`<div class="notice">Recommended sequence: understand the insurance business first, then trace how member, provider, benefit and claim information interact. The simulator is a teaching model, not an official Facets training environment.</div><div class="card"><div style="display:flex;justify-content:space-between"><h3>Course progress</h3><b>${db.lessonsCompleted.length}/${lessons.length}</b></div><div class="bar"><span style="width:${db.lessonsCompleted.length/lessons.length*100}%"></span></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Lessons</h3>${lessons.map((l,i)=>`<div class="lesson ${db.lessonsCompleted.includes(l.id)?'done':''}"><div><strong>${i+1}. ${l.title} ${db.lessonsCompleted.includes(l.id)?'✓':''}</strong><small>${l.desc}</small></div><button class="secondary" onclick="openLesson('${l.id}')">Study</button></div>`).join('')}</div><div class="card" id="lessonDetail"><h3>Select a lesson</h3><p class="muted">Choose a lesson to view the explanation and mark it complete.</p></div></div>`}
function openLesson(id){const l=lessons.find(x=>x.id===id);document.getElementById('lessonDetail').innerHTML=`<h3>${l.title}</h3><p>${l.body}</p><div class="notice">Think about how this concept could affect a member claim in the claims module.</div><button onclick="completeLesson('${id}')">${db.lessonsCompleted.includes(id)?'Completed ✓':'Mark lesson complete'}</button>`}
function completeLesson(id){if(!db.lessonsCompleted.includes(id))db.lessonsCompleted.push(id);save();render('learning');openLesson(id);toast('Lesson progress saved')}
function members(){return head('Members & enrollment','Manage sample members, coverage spans and plan assignments.',`<button onclick="memberForm()">＋ Add member</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Member ID</th><th>Name</th><th>Status</th><th>Plan</th><th>Effective</th><th>Family</th><th>Actions</th></tr></thead><tbody>${db.members.map(m=>`<tr><td><b>${esc(m.id)}</b></td><td>${esc(m.firstName+' '+m.lastName)}</td><td><span class="status ${m.status!=='Active'?'bad':''}">${esc(m.status)}</span></td><td>${esc(m.planId)}</td><td>${esc(m.effective||'—')}</td><td>${esc(m.familyId||'—')}</td><td><div class="actions"><button class="secondary" onclick="memberForm('${m.id}')">Edit</button><button class="danger" onclick="removeRecord('members','${m.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function providers(){return head('Providers & networks','Maintain sample provider records and network participation.',`<button onclick="providerForm()">＋ Add provider</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Provider ID</th><th>Name</th><th>Type</th><th>Network</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.providers.map(p=>`<tr><td><b>${esc(p.id)}</b></td><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td><span class="status ${p.network==='OUT'?'warn':''}">${p.network==='IN'?'In-network':'Out-of-network'}</span></td><td>${esc(p.status)}</td><td><div class="actions"><button class="secondary" onclick="providerForm('${p.id}')">Edit</button><button class="danger" onclick="removeRecord('providers','${p.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function plans(){return head('Benefits & plans','Configure simplified training benefits used by claim adjudication.',`<button onclick="planForm()">＋ Add plan</button>`)+`<div class="notice warn">Training simplification: real payer benefit designs can include service-specific rules, network tiers, copay/deductible sequencing, exclusions, accumulators and regulatory requirements not represented here.</div><div class="grid two">${db.plans.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${esc(p.name)}</h3><span class="pill">${esc(p.id)}</span></div><div class="resultgrid"><div><small>Individual deductible</small><b>${money(p.deductible)}</b></div><div><small>Coinsurance</small><b>${p.coinsurance}%</b></div><div><small>Individual OOP max</small><b>${money(p.oopMax)}</b></div></div><p class="muted">Family deductible: ${money(p.familyDeductible)} · Copay: ${money(p.copay)} · Family OOP: ${money(p.familyOopMax)}</p><div class="actions"><button class="secondary" onclick="planForm('${p.id}')">Edit configuration</button><button class="danger" onclick="removeRecord('plans','${p.id}')">Delete</button></div></div>`).join('')}</div>`}
function claims(){return head('Claims processing','Submit a training claim and run a simplified adjudication calculation.',`<button onclick="claimForm()">＋ Submit claim</button>`)+`<div class="notice">The engine demonstrates a simplified in-network/out-of-network claim calculation. It is not official Facets logic. Check the claim result and accumulator transaction details after processing.</div><div class="card"><h3>Claim submissions & adjudication</h3>${claimsTable()}</div>`}
function claimsTable(){if(!db.processed.length&&!db.claims.length)return '<div class="empty">No claims yet. Submit a claim to begin.</div>';return `<div class="tablewrap"><table><thead><tr><th>Claim ID</th><th>Member</th><th>Provider</th><th>Service date</th><th>Billed</th><th>Allowed</th><th>Member</th><th>Payer</th><th>Status</th></tr></thead><tbody>${db.processed.slice().reverse().map(c=>`<tr><td><b>${esc(c.claimId)}</b></td><td>${esc(c.memberName)}</td><td>${esc(c.providerName)}</td><td>${esc(c.serviceDate)}</td><td>${money(c.billed)}</td><td>${money(c.allowed)}</td><td>${money(c.memberAmount)}</td><td>${money(c.payerPaid)}</td><td><span class="status">${esc(c.status)}</span></td></tr>`).join('')}</tbody></table></div>`}
function accumulators(){const active=db.accumulatorTransactions.filter(t=>!t.reversed);const by={};active.forEach(t=>{const k=t.memberId+'|'+t.planId;by[k]=(by[k]||0)+t.memberAmount});return head('Accumulator lab','Review member-level deductible and out-of-pocket progress.',`<button class="secondary" onclick="page('claims')">Process a claim</button>`)+`<div class="notice">In this training engine, qualifying member cost share contributes to the simplified individual deductible and OOP trackers. Copay is counted toward OOP. Actual plans may define different accumulator buckets and carryover rules.</div><div class="card"><h3>Member accumulator balances</h3><div class="tablewrap"><table><thead><tr><th>Member</th><th>Plan</th><th>Deductible used</th><th>Deductible remaining</th><th>OOP used</th><th>OOP remaining</th></tr></thead><tbody>${db.members.map(m=>{const p=db.plans.find(x=>x.id===m.planId);if(!p)return '';const tx=active.filter(t=>t.memberId===m.id);const ded=tx.reduce((s,t)=>s+t.deductibleApplied,0),oop=tx.reduce((s,t)=>s+t.memberAmount,0);return `<tr><td><b>${esc(m.firstName+' '+m.lastName)}</b><br><small>${esc(m.id)}</small></td><td>${esc(p.name)}</td><td>${money(ded)}</td><td>${money(Math.max(0,p.deductible-ded))}</td><td>${money(oop)}</td><td>${money(Math.max(0,p.oopMax-oop))}</td></tr>`}).join('')}</tbody></table></div></div><div class="card" style="margin-top:16px"><h3>Accumulator transaction ledger</h3>${db.accumulatorTransactions.length?`<div class="tablewrap"><table><thead><tr><th>Transaction</th><th>Claim</th><th>Member</th><th>Deductible</th><th>Member cost share</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.accumulatorTransactions.slice().reverse().map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.claimId)}</td><td>${esc(t.memberId)}</td><td>${money(t.deductibleApplied)}</td><td>${money(t.memberAmount)}</td><td><span class="status ${t.reversed?'bad':''}">${t.reversed?'Reversed':'Posted'}</span></td><td>${t.reversed?'—':`<button class="danger" onclick="reverseTransaction('${t.id}')">Reverse</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No accumulator transactions yet.</div>'}</div>`}
function workbench(){return head('JSON workbench','Inspect, edit, validate, import and export the complete training dataset.',`<button onclick="exportJSON()">Download JSON</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>`)+`<div class="grid two"><div class="card"><h3>Dataset editor</h3><p class="muted">Edit the JSON then validate and apply it. Applying replaces the current local training dataset.</p><textarea id="jsonEditor" class="jsonarea">${esc(JSON.stringify(db,null,2))}</textarea><div class="toolbar" style="margin-top:10px"><button onclick="applyJSON()">Validate & apply</button><button class="secondary" onclick="refreshJSON()">Reload current data</button><button class="ghost" onclick="copyJSON()">Copy JSON</button></div><div id="jsonMessage"></div></div><div class="card"><h3>Dataset contents</h3>${Object.entries(db).map(([k,v])=>`<div class="lesson"><div><strong>${esc(k)}</strong><small>${Array.isArray(v)?v.length+' records':typeof v}</small></div><span class="pill">${Array.isArray(v)?'ARRAY':'OBJECT'}</span></div>`).join('')}<div class="notice">Local persistence is enabled. Changes are stored in this browser on this device. Export backups regularly if you want to move the scenario to another browser or computer.</div><button class="danger" onclick="resetData()">Reset all data to sample dataset</button></div></div>`}
function reports(){const total=db.processed.length,denied=db.processed.filter(x=>x.status==='Denied').length,paid=db.processed.reduce((s,x)=>s+x.payerPaid,0);return head('Reports & history','Summaries of claim activity and training data.')+`<div class="grid stats">${stat('Claims processed',total,'▣','All adjudication runs')}${stat('Denied claims',denied,'!','Training validation failures')}${stat('Payer paid',money(paid),'$','Simplified claim results')}${stat('Accumulator entries',db.accumulatorTransactions.length,'◷','Including reversals')}</div><div class="card"><h3>Adjudication history</h3>${claimsTable()}</div><div class="card" style="margin-top:16px"><h3>Data management</h3><p class="muted">Export a full JSON backup or import a previously saved scenario.</p><div class="actions"><button onclick="exportJSON()">Export full dataset</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import dataset</button></div></div>`}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="ghost" onclick="closeModal()">✕</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,name,value='',type='text',opts=null){if(opts)return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o.value)}" ${String(value)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}
function memberForm(id=''){const m=db.members.find(x=>x.id===id)||{id:'',firstName:'',lastName:'',dob:'',status:'Active',planId:db.plans[0]?.id||'',effective:'2026-01-01',termination:'',familyId:'',relationship:'Subscriber'};modal(id?'Edit member':'Add member',`<form id="recordForm" class="formgrid">${field('Member ID','id',m.id)}${field('First name','firstName',m.firstName)}${field('Last name','lastName',m.lastName)}${field('Date of birth','dob',m.dob,'date')}${field('Status','status',m.status,'text',[{value:'Active',label:'Active'},{value:'Inactive',label:'Inactive'},{value:'Terminated',label:'Terminated'}])}${field('Plan','planId',m.planId,'text',db.plans.map(p=>({value:p.id,label:p.name+' ('+p.id+')'})))}${field('Coverage effective date','effective',m.effective,'date')}${field('Termination date','termination',m.termination,'date')}${field('Family ID','familyId',m.familyId)}${field('Relationship','relationship',m.relationship,'text',['Subscriber','Spouse','Child','Other'].map(x=>({value:x,label:x}))) }<div class="field full"><button>Save member</button></div></form>`);document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(!o.id||!o.firstName||!o.planId)return toast('Member ID, first name and plan are required');const i=db.members.findIndex(x=>x.id===id);if(i>=0)db.members[i]=o;else{if(db.members.some(x=>x.id===o.id))return toast('Member ID already exists');db.members.push(o)}save();closeModal();render('members');toast('Member saved')}}
function providerForm(id=''){const p=db.providers.find(x=>x.id===id)||{id:'',name:'',type:'Professional',network:'IN',status:'Active',tin:''};modal(id?'Edit provider':'Add provider',`<form id="recordForm" class="formgrid">${field('Provider ID','id',p.id)}${field('Provider name','name',p.name)}${field('Provider type','type',p.type,'text',['Professional','Institutional','Ancillary'].map(x=>({value:x,label:x})))}${field('Network','network',p.network,'text',[{value:'IN',label:'In-network'},{value:'OUT',label:'Out-of-network'}])}${field('Status','status',p.status,'text',[{value:'Active',label:'Active'},{value:'Inactive',label:'Inactive'}])}${field('Tax ID (sample)','tin',p.tin)}<div class="field full"><button>Save provider</button></div></form>`);document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(!o.id||!o.name)return toast('Provider ID and name are required');const i=db.providers.findIndex(x=>x.id===id);if(i>=0)db.providers[i]=o;else{if(db.providers.some(x=>x.id===o.id))return toast('Provider ID already exists');db.providers.push(o)}save();closeModal();render('providers');toast('Provider saved')}}
function planForm(id=''){const p=db.plans.find(x=>x.id===id)||{id:'',name:'',deductible:1000,familyDeductible:2000,copay:30,coinsurance:20,oopMax:5000,familyOopMax:10000,outNetworkCoinsurance:40,annualVisitLimit:20};modal(id?'Edit benefit plan':'Add benefit plan',`<form id="recordForm" class="formgrid">${field('Plan ID','id',p.id)}${field('Plan name','name',p.name)}${field('Individual deductible ($)','deductible',p.deductible,'number')}${field('Family deductible ($)','familyDeductible',p.familyDeductible,'number')}${field('Copay ($)','copay',p.copay,'number')}${field('In-network coinsurance (%)','coinsurance',p.coinsurance,'number')}${field('Out-of-network coinsurance (%)','outNetworkCoinsurance',p.outNetworkCoinsurance,'number')}${field('Individual OOP maximum ($)','oopMax',p.oopMax,'number')}${field('Family OOP maximum ($)','familyOopMax',p.familyOopMax,'number')}${field('Annual visit limit','annualVisitLimit',p.annualVisitLimit,'number')}<div class="field full"><button>Save plan</button></div></form>`);document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));['deductible','familyDeductible','copay','coinsurance','outNetworkCoinsurance','oopMax','familyOopMax','annualVisitLimit'].forEach(k=>o[k]=Number(o[k]));if(!o.id||!o.name)return toast('Plan ID and name are required');if(o.coinsurance<0||o.coinsurance>100||o.outNetworkCoinsurance<0||o.outNetworkCoinsurance>100)return toast('Coinsurance must be between 0 and 100');const i=db.plans.findIndex(x=>x.id===id);if(i>=0)db.plans[i]=o;else{if(db.plans.some(x=>x.id===o.id))return toast('Plan ID already exists');db.plans.push(o)}save();closeModal();render('plans');toast('Plan configuration saved')}}
function claimForm(){const m=db.members[0],p=db.providers[0];modal('Submit training claim',`<form id="claimForm" class="formgrid">${field('Claim ID','claimId','CLM'+String(Date.now()).slice(-6))}${field('Member','memberId',m?.id,'text',db.members.map(x=>({value:x.id,label:x.id+' – '+x.firstName+' '+x.lastName})))}${field('Provider','providerId',p?.id,'text',db.providers.map(x=>({value:x.id,label:x.id+' – '+x.name+' ('+x.network+')'})))}${field('Service date','serviceDate',new Date().toISOString().slice(0,10),'date')}${field('Service category','service','Office visit','text',['Office visit','Hospital','Diagnostic','Specialist'].map(x=>({value:x,label:x})))}${field('Billed amount ($)','billed',500,'number')}${field('Allowed amount ($)','allowed',400,'number')}<div class="field full"><label><input type="checkbox" name="covered" checked style="width:auto"> Covered service (training flag)</label></div><div class="field full"><button>Run adjudication</button></div></form>`);document.getElementById('claimForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.covered=e.target.covered.checked;o.billed=Number(o.billed);o.allowed=Number(o.allowed);if(!o.claimId||o.billed<=0||o.allowed<0||o.allowed>o.billed)return toast('Check claim ID and amounts; allowed cannot exceed billed');if(db.processed.some(x=>x.claimId===o.claimId))return toast('Claim ID already processed; use a new ID');const result=adjudicate(o);db.claims.push(o);db.processed.push(result);if(result.status==='Processed')db.accumulatorTransactions.push(result.transaction);save();closeModal();render('claims');toast(result.status==='Processed'?'Claim adjudicated':'Claim denied: '+result.reason)}}
function adjudicate(c){const m=db.members.find(x=>x.id===c.memberId),pr=db.providers.find(x=>x.id===c.providerId),pl=m&&db.plans.find(x=>x.id===m.planId);let base={claimId:c.claimId,memberId:c.memberId,providerId:c.providerId,serviceDate:c.serviceDate,billed:c.billed,allowed:c.allowed,memberName:m?m.firstName+' '+m.lastName:'Unknown',providerName:pr?.name||'Unknown',payerPaid:0,memberAmount:0,deductibleApplied:0,status:'Denied',reason:''};if(!m){base.reason='Member not found';return base}if(!pr){base.reason='Provider not found';return base}if(!pl){base.reason='Benefit plan not found';return base}if(m.status!=='Active'||c.serviceDate<m.effective||(m.termination&&c.serviceDate>m.termination)){base.reason='Member not eligible on service date';return base}if(pr.status!=='Active'){base.reason='Provider inactive';return base}if(!c.covered){base.reason='Service not covered';return base}if(c.allowed===0){base.reason='No allowed amount';return base}
 const net=pr.network==='IN',txs=db.accumulatorTransactions.filter(t=>t.memberId===m.id&&!t.reversed),dedUsed=txs.reduce((s,t)=>s+t.deductibleApplied,0),oopUsed=txs.reduce((s,t)=>s+t.memberAmount,0),dedRemain=Math.max(0,pl.deductible-dedUsed),oopRemain=Math.max(0,pl.oopMax-oopUsed);
 const ded=Math.min(c.allowed,dedRemain,oopRemain),afterDed=c.allowed-ded;let coins=afterDed*(net?pl.coinsurance:pl.outNetworkCoinsurance)/100;let copay=Math.min(pl.copay,Math.max(0,afterDed-coins));let memberRaw=ded+coins+copay;const member=Math.min(memberRaw,oopRemain,c.allowed);const payer=Math.max(0,c.allowed-member);const appliedDed=Math.min(ded,member);base.status='Processed';base.reason='Passed simplified training validations';base.network=net?'In-network':'Out-of-network';base.deductibleApplied=appliedDed;base.memberAmount=member;base.payerPaid=payer;base.costShare={deductible:appliedDed,coinsurance:Math.max(0,member-appliedDed-copay),copay:Math.min(copay,Math.max(0,member-appliedDed))};base.transaction={id:'AT'+Date.now(),claimId:c.claimId,memberId:m.id,planId:pl.id,deductibleApplied:appliedDed,memberAmount:member,reversed:false,createdAt:new Date().toISOString()};return base}
function reverseTransaction(id){const t=db.accumulatorTransactions.find(x=>x.id===id);if(!t)return;t.reversed=true;save();render('accumulators');toast('Accumulator transaction reversed. Balances recalculated from active ledger entries.')}
function removeRecord(type,id){if(!confirm('Delete this '+type.slice(0,-1)+' record?'))return;db[type]=db[type].filter(x=>x.id!==id);save();const p={members:'members',providers:'providers',plans:'plans'}[type];render(p);toast('Record deleted')}
function recentTable(n){if(!db.processed.length)return '<div class="empty">No adjudication activity yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Claim</th><th>Member</th><th>Allowed</th><th>Member cost</th><th>Status</th></tr></thead><tbody>${db.processed.slice(-n).reverse().map(c=>`<tr><td>${esc(c.claimId)}</td><td>${esc(c.memberName)}</td><td>${money(c.allowed)}</td><td>${money(c.memberAmount)}</td><td><span class="status ${c.status==='Denied'?'bad':''}">${c.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='facets-learning-workbench-data.json';a.click();URL.revokeObjectURL(url);toast('JSON backup downloaded')}
function refreshJSON(){document.getElementById('jsonEditor').value=JSON.stringify(db,null,2);document.getElementById('jsonMessage').innerHTML=''}
function copyJSON(){navigator.clipboard?.writeText(document.getElementById('jsonEditor').value).then(()=>toast('JSON copied')).catch(()=>toast('Clipboard unavailable; select and copy manually'))}
function applyJSON(){const box=document.getElementById('jsonMessage');try{const x=JSON.parse(document.getElementById('jsonEditor').value);for(const k of ['members','providers','plans','claims','accumulatorTransactions','processed','lessonsCompleted'])if(!Array.isArray(x[k]))throw Error('Expected an array for '+k);if(!x.members.every(m=>m.id)||!x.plans.every(p=>p.id))throw Error('Member and plan IDs are required');db=x;save();box.innerHTML='<div class="notice good">Valid JSON applied and saved to local storage.</div>';toast('Dataset updated')}catch(e){box.innerHTML='<div class="notice warn">JSON not applied: '+esc(e.message)+'</div>'}}
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());for(const k of ['members','providers','plans','claims','accumulatorTransactions','processed','lessonsCompleted'])if(!Array.isArray(x[k]))throw Error('Invalid dataset: missing '+k);db=x;save();page('dashboard');toast('Dataset imported successfully')}catch(err){alert('Import failed: '+err.message)}e.target.value=''}
function resetData(){if(!confirm('Reset all local data, claim history and lesson progress to the original sample dataset?'))return;db=structuredClone(seed);save();page('dashboard');toast('Sample data restored')}

const tourSteps = [
 {title:'Your learning dashboard',text:'This is your starting point. It summarizes members, providers, plans, processed claims and your learning progress.',target:'.nav button[data-page="dashboard"]',page:'dashboard'},
 {title:'Learning center',text:'Study healthcare payer concepts in a guided sequence. Mark lessons complete as you build your understanding of Facets and accumulators.',target:'.nav button[data-page="learning"]',page:'learning'},
 {title:'Members & enrollment',text:'Create sample members, assign a benefit plan and maintain coverage effective dates. Claim eligibility is checked against these records.',target:'.nav button[data-page="members"]',page:'members'},
 {title:'Providers & networks',text:'Maintain hospitals and doctors, including in-network or out-of-network participation. Network status affects the simplified claim calculation.',target:'.nav button[data-page="providers"]',page:'providers'},
 {title:'Benefits & plans',text:'Edit deductibles, copays, coinsurance and out-of-pocket maximums. The claim simulator reads these plan settings when adjudicating a claim.',target:'.nav button[data-page="plans"]',page:'plans'},
 {title:'Claims processing',text:'Submit a claim for a member and provider. The training engine checks basic eligibility and coverage, then calculates member cost share and payer payment.',target:'.nav button[data-page="claims"]',page:'claims'},
 {title:'Accumulator lab',text:'Review deductible and OOP balances after claim processing. Reverse a posted transaction to see how balances are recalculated from the active ledger.',target:'.nav button[data-page="accumulators"]',page:'accumulators'},
 {title:'JSON workbench',text:'Inspect the full dataset, edit JSON, validate changes, import a saved scenario or export a backup. Applying JSON replaces the current training data.',target:'.nav button[data-page="workbench"]',page:'workbench'},
 {title:'Reports & history',text:'Review adjudication history, payer-paid totals and accumulator transaction counts. Your local data stays in this browser until you clear it or reset the sample dataset.',target:'.nav button[data-page="reports"]',page:'reports'}
];
let tourIndex=0;
function clearTourFocus(){document.querySelectorAll('.tour-focus').forEach(x=>x.classList.remove('tour-focus'))}
function startTour(){tourIndex=0;showTourStep()}
function showTourStep(){
 const s=tourSteps[tourIndex]; if(!s)return finishTour();
 const current=document.querySelector('.nav button[data-page="'+s.page+'"]');
 if(s.page!==document.querySelector('.nav button.active')?.dataset.page)page(s.page);
 clearTourFocus();
 const target=document.querySelector(s.target);
 if(target){target.classList.add('tour-focus');if(window.innerWidth<950)document.getElementById('sidebar').classList.add('open');}
 const root=document.getElementById('tourRoot');
 root.innerHTML=`<div class="tour-backdrop" role="dialog" aria-modal="true" aria-label="Guided tour"><div class="tour-panel"><div class="tour-kicker">Guided product tour · Step ${tourIndex+1} of ${tourSteps.length}</div><div class="tour-progress"><span style="width:${(tourIndex+1)/tourSteps.length*100}%"></span></div><h2>${s.title}</h2><p>${s.text}</p><div class="tour-actions"><button class="ghost" onclick="finishTour()">Skip tour</button><div class="right">${tourIndex?'<button class="secondary" onclick="tourBack()">Back</button>':''}<button onclick="tourNext()">${tourIndex===tourSteps.length-1?'Finish':'Next'}</button></div></div></div></div>`;
}
function tourNext(){if(tourIndex<tourSteps.length-1){tourIndex++;showTourStep()}else finishTour()}
function tourBack(){if(tourIndex>0){tourIndex--;showTourStep()}}
function finishTour(){clearTourFocus();document.getElementById('tourRoot').innerHTML='';document.getElementById('sidebar').classList.remove('open');localStorage.setItem('facets_workbench_tour_seen','1');}
function welcomeTour(){
 if(localStorage.getItem('facets_workbench_tour_seen'))return;
 document.getElementById('tourRoot').innerHTML=`<div class="tour-backdrop" role="dialog" aria-modal="true" aria-label="Welcome"><div class="tour-panel"><div class="tour-welcome-icon">✦</div><div class="tour-kicker" style="margin-top:14px">Welcome to your training workspace</div><h2>Take a quick guided tour?</h2><p>We'll show you where to learn the healthcare concepts, configure sample members and plans, process claims, inspect accumulators, and manage JSON scenarios.</p><div class="tour-actions"><button class="ghost" onclick="finishTour()">Explore on my own</button><div class="right"><button onclick="finishTour()">Not now</button><button onclick="startTour()">Start tour</button></div></div></div></div>`;
}
document.getElementById('tourTop').addEventListener('click',startTour);

save();render('dashboard');welcomeTour();
</script>
</body></html>
