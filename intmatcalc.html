<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interior Material Estimate</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f3f4f6;
        color: #111827;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 {
        text-align: center;
        margin: 0 0 25px;
        font-size: 26px;
    }

    .header {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 20px;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 14px;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 950px;
    }

    th, td {
        border: 1px solid #d1d5db;
        padding: 8px;
        text-align: center;
    }

    th {
        background: #1f2937;
        color: white;
        font-size: 13px;
    }

    td input {
        min-width: 80px;
    }

    .dimensions {
        display: flex;
        gap: 5px;
    }

    .dimensions input {
        width: 50%;
    }

    .amount {
        font-weight: bold;
        white-space: nowrap;
    }

    .total-row td {
        font-weight: bold;
        font-size: 16px;
        background: #f3f4f6;
    }

    .buttons {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 10px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
    }

    .add-btn {
        background: #2563eb;
        color: white;
    }

    .print-btn {
        background: #059669;
        color: white;
    }

    .delete-btn {
        background: #dc2626;
        color: white;
        padding: 6px 10px;
    }

    .note {
        margin-top: 15px;
        color: #6b7280;
        font-size: 12px;
    }

    @media (max-width: 700px) {
        .header {
            grid-template-columns: 1fr;
        }

        body {
            padding: 10px;
        }

        .container {
            padding: 15px;
        }
    }

    @media print {
        body {
            background: white;
            padding: 0;
        }

        .container {
            box-shadow: none;
            max-width: none;
            padding: 0;
        }

        .buttons,
        .delete-column,
        .note {
            display: none !important;
        }

        input, select {
            border: none;
            padding: 2px;
            appearance: none;
            background: transparent;
        }

        table {
            min-width: 0;
        }

        th {
            background: #ddd !important;
            color: #000 !important;
        }

        @page {
            size: A4 landscape;
            margin: 10mm;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Interior Material Estimate</h1>

    <div class="header">
        <div>
            <label for="customerName">Name</label>
            <input type="text" id="customerName" placeholder="Enter name">
        </div>

        <div>
            <label for="estimateDate">Date</label>
            <input type="date" id="estimateDate">
        </div>
    </div>

    <div class="table-wrapper">
        <table id="estimateTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Room Type</th>
                    <th>Material Type</th>
                    <th>Length (cm)</th>
                    <th>Width (cm)</th>
                    <th>Sq Ft</th>
                    <th>Rate / Sq Ft</th>
                    <th>Amount</th>
                    <th class="delete-column">Action</th>
                </tr>
            </thead>

            <tbody id="tableBody">
            </tbody>

            <tfoot>
                <tr class="total-row">
                    <td colspan="7" style="text-align:right;">TOTAL</td>
                    <td id="grandTotal">0.00</td>
                    <td class="delete-column"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="buttons">
        <button class="add-btn" onclick="addRow()">+ Add Row</button>
        <button class="print-btn" onclick="window.print()">🖨 Print</button>
    </div>

    <div class="note">
        Enter Length and Width in cm to automatically calculate Sq Ft.
        If Sq Ft is entered manually, it will be used instead.
    </div>

</div>

<script>
    let rowNumber = 0;

    function addRow() {
        rowNumber++;

        const tbody = document.getElementById("tableBody");

        const row = document.createElement("tr");

        row.innerHTML = `
            <td class="row-number">${rowNumber}</td>

            <td>
                <input type="text"
                       class="room"
                       placeholder="e.g. Bedroom">
            </td>

            <td>
                <input type="text"
                       class="material"
                       placeholder="e.g. Tiles">
            </td>

            <td>
                <input type="number"
                       class="length"
                       min="0"
                       step="0.01"
                       placeholder="cm"
                       oninput="calculateRow(this)">
            </td>

            <td>
                <input type="number"
                       class="width"
                       min="0"
                       step="0.01"
                       placeholder="cm"
                       oninput="calculateRow(this)">
            </td>

            <td>
                <input type="number"
                       class="sqft"
                       min="0"
                       step="0.01"
                       placeholder="Sq Ft"
                       oninput="calculateRow(this)">
            </td>

            <td>
                <input type="number"
                       class="rate"
                       min="0"
                       step="0.01"
                       placeholder="Rate"
                       oninput="calculateRow(this)">
            </td>

            <td class="amount">0.00</td>

            <td class="delete-column">
                <button class="delete-btn"
                        onclick="deleteRow(this)">
                    ×
                </button>
            </td>
        `;

        tbody.appendChild(row);
    }

    function calculateRow(input) {
        const row = input.closest("tr");

        const length = parseFloat(
            row.querySelector(".length").value
        ) || 0;

        const width = parseFloat(
            row.querySelector(".width").value
        ) || 0;

        const sqftInput = row.querySelector(".sqft");

        /*
         * 1 square foot = 929.0304 sq cm
         *
         * If both dimensions are entered,
         * automatically calculate Sq Ft.
         */
        if (length > 0 && width > 0) {
            const sqft = (length * width) / 929.0304;
            sqftInput.value = sqft.toFixed(2);
        }

        const sqft = parseFloat(sqftInput.value) || 0;

        const rate = parseFloat(
            row.querySelector(".rate").value
        ) || 0;

        const amount = sqft * rate;

        row.querySelector(".amount").textContent =
            amount.toFixed(2);

        calculateTotal();
    }

    function calculateTotal() {
        let total = 0;

        document.querySelectorAll(".amount").forEach(cell => {
            total += parseFloat(cell.textContent) || 0;
        });

        document.getElementById("grandTotal").textContent =
            total.toFixed(2);
    }

    function deleteRow(button) {
        button.closest("tr").remove();

        updateRowNumbers();
        calculateTotal();
    }

    function updateRowNumbers() {
        const rows = document.querySelectorAll("#tableBody tr");

        rows.forEach((row, index) => {
            row.querySelector(".row-number").textContent =
                index + 1;
        });

        rowNumber = rows.length;
    }

    // Set today's date automatically
    document.getElementById("estimateDate").value =
        new Date().toISOString().split("T")[0];

    // Start with 3 rows
    addRow();
    addRow();
    addRow();
</script>

</body>
</html>
