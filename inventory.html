<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory App</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f6f8;
  color: #222;
}

header {
  background: #2563eb;
  color: white;
  padding: 20px;
}

header h1 {
  font-size: 24px;
}

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

/* =========================
   DASHBOARD
========================= */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h3 {
  color: #666;
  font-size: 14px;
  margin-bottom: 8px;
}

.card p {
  font-size: 25px;
  font-weight: bold;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 200px;
}

input,
button {
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
}

input {
  background: white;
}

button {
  border: none;
  cursor: pointer;
  color: white;
  background: #2563eb;
}

button:hover {
  opacity: .9;
}

.success {
  background: #16a34a;
}

.danger {
  background: #dc2626;
}

.backup {
  background: #7c3aed;
}

.restore {
  background: #ea580c;
}

.secondary {
  background: #64748b;
}

/* =========================
   TABLE
========================= */

.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

th,
td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid #eee;
}

th {
  background: #f8fafc;
  color: #555;
}

.low {
  color: #dc2626;
  font-weight: bold;
}

.ok {
  color: #16a34a;
  font-weight: bold;
}

.actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

/* =========================
   MODAL
========================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  justify-content: center;
  align-items: center;
  padding: 15px;
  z-index: 1000;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 450px;
  padding: 25px;
  border-radius: 12px;
}

.modal-box h2 {
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: #555;
}

.form-group input {
  width: 100%;
}

.form-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
  text-align: center;
  padding: 30px;
  color: #777;
}

/* =========================
   NOTIFICATION
========================= */

.notification {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #222;
  color: white;
  padding: 14px 20px;
  border-radius: 8px;
  display: none;
  z-index: 2000;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .stats {
    grid-template-columns: 1fr;
  }

  .toolbar {
    flex-direction: column;
  }

  .toolbar input,
  .toolbar button {
    width: 100%;
  }

  table {
    font-size: 13px;
  }

  th,
  td {
    padding: 9px;
  }

  .actions {
    flex-direction: column;
  }

  .actions button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <h1>📦 Inventory App</h1>
  </div>
</header>

<div class="container">

  <!-- =========================
       DASHBOARD
  ========================== -->

  <div class="stats">

    <div class="card">
      <h3>Total Products</h3>
      <p id="totalProducts">0</p>
    </div>

    <div class="card">
      <h3>Total Stock</h3>
      <p id="totalStock">0</p>
    </div>

    <div class="card">
      <h3>Low Stock</h3>
      <p id="lowStock">0</p>
    </div>

  </div>


  <!-- =========================
       TOOLBAR
  ========================== -->

  <div class="toolbar">

    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔍 Search products..."
      oninput="renderProducts()"
    >

    <button onclick="openAddModal()">
      + Add Product
    </button>

    <button class="backup" onclick="backupJSON()">
      💾 Backup JSON
    </button>

    <button
      class="restore"
      onclick="document.getElementById('restoreFile').click()">
      📂 Restore JSON
    </button>

    <input
      type="file"
      id="restoreFile"
      accept=".json,application/json"
      style="display:none"
      onchange="restoreJSON(event)"
    >

  </div>


  <!-- =========================
       PRODUCT TABLE
  ========================== -->

  <div class="table-wrapper">

    <table>

      <thead>
        <tr>
          <th>Product</th>
          <th>SKU</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="productTable"></tbody>

    </table>

  </div>

</div>


<!-- =========================
     PRODUCT MODAL
========================== -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <h2 id="modalTitle">➕ Add Product</h2>

    <div class="form-group">
      <label>Product Name</label>

      <input
        type="text"
        id="productName"
        placeholder="Example: Rice 25kg">
    </div>

    <div class="form-group">
      <label>SKU</label>

      <input
        type="text"
        id="productSKU"
        placeholder="Example: RICE-025">
    </div>

    <div class="form-group">
      <label>Price (₹)</label>

      <input
        type="number"
        id="productPrice"
        min="0"
        placeholder="500">
    </div>

    <div class="form-group">
      <label>Stock Quantity</label>

      <input
        type="number"
        id="productStock"
        min="0"
        placeholder="10">
    </div>

    <div class="form-group">
      <label>Minimum Stock</label>

      <input
        type="number"
        id="productMinimum"
        min="0"
        placeholder="5">
    </div>

    <div class="form-buttons">

      <button
        class="secondary"
        onclick="closeModal()">
        Cancel
      </button>

      <button onclick="saveProduct()">
        Save Product
      </button>

    </div>

  </div>

</div>


<!-- =========================
     NOTIFICATION
========================== -->

<div
  id="notification"
  class="notification">
</div>


<script>

/* =====================================================
   DATA
===================================================== */

let products =
  JSON.parse(
    localStorage.getItem("inventoryProducts")
  ) || [

    {
      name: "Rice 25kg",
      sku: "RICE-025",
      price: 1200,
      stock: 20,
      minimum: 5
    },

    {
      name: "Sugar 1kg",
      sku: "SUGAR-001",
      price: 50,
      stock: 4,
      minimum: 5
    },

    {
      name: "Cooking Oil 1L",
      sku: "OIL-001",
      price: 150,
      stock: 12,
      minimum: 5
    }

  ];


/*
  -1 means we are adding a new product.
  0, 1, 2... means we are editing that product.
*/

let editingIndex = -1;


/* =====================================================
   SAVE DATA
===================================================== */

function saveProducts() {

  localStorage.setItem(
    "inventoryProducts",
    JSON.stringify(products)
  );

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

  const table =
    document.getElementById("productTable");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  table.innerHTML = "";


  const filtered =
    products.filter(product =>

      product.name
        .toLowerCase()
        .includes(search)

      ||

      product.sku
        .toLowerCase()
        .includes(search)

    );


  if (filtered.length === 0) {

    table.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No products found.
        </td>
      </tr>
    `;

    updateStats();

    return;
  }


  filtered.forEach(product => {

    const originalIndex =
      products.indexOf(product);


    const isLow =
      Number(product.stock) <=
      Number(product.minimum);


    const status = isLow

      ? `<span class="low">⚠️ Low Stock</span>`

      : `<span class="ok">✓ In Stock</span>`;


    table.innerHTML += `

      <tr>

        <td>
          <strong>
            ${escapeHTML(product.name)}
          </strong>
        </td>

        <td>
          ${escapeHTML(product.sku)}
        </td>

        <td>
          ₹${Number(product.price).toLocaleString("en-IN")}
        </td>

        <td>
          ${Number(product.stock)}
        </td>

        <td>
          ${status}
        </td>

        <td>

          <div class="actions">

            <button
              class="success"
              onclick="stockIn(${originalIndex})">
              + Stock
            </button>

            <button
              class="danger"
              onclick="stockOut(${originalIndex})">
              - Stock
            </button>

            <button
              onclick="editProduct(${originalIndex})">
              ✏️ Edit
            </button>

            <button
              class="danger"
              onclick="deleteProduct(${originalIndex})">
              🗑️ Delete
            </button>

          </div>

        </td>

      </tr>

    `;

  });


  updateStats();

}


/* =====================================================
   DASHBOARD STATISTICS
===================================================== */

function updateStats() {

  document
    .getElementById("totalProducts")
    .textContent =
    products.length;


  document
    .getElementById("totalStock")
    .textContent =
    products.reduce(
      (total, product) =>
        total + Number(product.stock),
      0
    );


  document
    .getElementById("lowStock")
    .textContent =
    products.filter(product =>
      Number(product.stock) <=
      Number(product.minimum)
    ).length;

}


/* =====================================================
   OPEN ADD MODAL
===================================================== */

function openAddModal() {

  editingIndex = -1;

  clearForm();

  document
    .getElementById("modalTitle")
    .textContent =
    "➕ Add Product";

  document
    .getElementById("productModal")
    .style.display =
    "flex";

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(index) {

  const product =
    products[index];

  editingIndex = index;


  document
    .getElementById("productName")
    .value =
    product.name;


  document
    .getElementById("productSKU")
    .value =
    product.sku;


  document
    .getElementById("productPrice")
    .value =
    product.price;


  document
    .getElementById("productStock")
    .value =
    product.stock;


  document
    .getElementById("productMinimum")
    .value =
    product.minimum;


  document
    .getElementById("modalTitle")
    .textContent =
    "✏️ Edit Product";


  document
    .getElementById("productModal")
    .style.display =
    "flex";

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const sku =
    document
      .getElementById("productSKU")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const stock =
    Number(
      document
        .getElementById("productStock")
        .value
    );


  const minimum =
    Number(
      document
        .getElementById("productMinimum")
        .value
    );


  /* Validation */

  if (!name) {

    alert("Please enter product name.");

    return;
  }


  if (!sku) {

    alert("Please enter SKU.");

    return;
  }


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    alert("Please enter a valid price.");

    return;
  }


  if (
    !Number.isFinite(stock) ||
    stock < 0
  ) {

    alert("Please enter a valid stock quantity.");

    return;
  }


  if (
    !Number.isFinite(minimum) ||
    minimum < 0
  ) {

    alert("Please enter a valid minimum stock.");

    return;
  }


  /* Check duplicate SKU */

  const duplicate =
    products.some(
      (product, index) =>

        product.sku.toLowerCase() ===
        sku.toLowerCase()

        &&

        index !== editingIndex
    );


  if (duplicate) {

    alert(
      "A product with this SKU already exists."
    );

    return;
  }


  const product = {

    name: name,

    sku: sku,

    price: price,

    stock: stock,

    minimum: minimum

  };


  /* ADD */

  if (editingIndex === -1) {

    products.push(product);

    showNotification(
      "Product added successfully."
    );

  }

  /* EDIT */

  else {

    products[editingIndex] =
      product;

    showNotification(
      "Product updated successfully."
    );

  }


  saveProducts();

  closeModal();

  renderProducts();

}


/* =====================================================
   STOCK IN
===================================================== */

function stockIn(index) {

  const amount =
    Number(
      prompt(
        "How many items are you adding?"
      )
    );


  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    return;
  }


  products[index].stock =
    Number(products[index].stock) +
    amount;


  saveProducts();

  renderProducts();

  showNotification(
    "Stock added successfully."
  );

}


/* =====================================================
   STOCK OUT
===================================================== */

function stockOut(index) {

  const amount =
    Number(
      prompt(
        "How many items are you removing?"
      )
    );


  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    return;
  }


  if (
    amount >
    Number(products[index].stock)
  ) {

    alert(
      "Not enough stock available."
    );

    return;
  }


  products[index].stock =
    Number(products[index].stock) -
    amount;


  saveProducts();

  renderProducts();

  showNotification(
    "Stock removed successfully."
  );

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

function deleteProduct(index) {

  const confirmed =
    confirm(
      `Delete "${products[index].name}"?`
    );


  if (!confirmed) {
    return;
  }


  products.splice(index, 1);

  saveProducts();

  renderProducts();

  showNotification(
    "Product deleted."
  );

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  document
    .getElementById("productName")
    .value = "";

  document
    .getElementById("productSKU")
    .value = "";

  document
    .getElementById("productPrice")
    .value = "";

  document
    .getElementById("productStock")
    .value = "";

  document
    .getElementById("productMinimum")
    .value = "";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

  document
    .getElementById("productModal")
    .style.display =
    "none";

  clearForm();

  editingIndex = -1;

  document
    .getElementById("modalTitle")
    .textContent =
    "➕ Add Product";

}


/* =====================================================
   JSON BACKUP
===================================================== */

function backupJSON() {

  if (products.length === 0) {

    alert(
      "There are no products to backup."
    );

    return;
  }


  const backupData = {

    app: "Inventory App",

    version: 1,

    backupDate:
      new Date().toISOString(),

    products: products

  };


  const json =
    JSON.stringify(
      backupData,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  const date =
    new Date()
      .toISOString()
      .slice(0, 10);


  link.href = url;

  link.download =
    `inventory-backup-${date}.json`;


  document
    .body
    .appendChild(link);


  link.click();

  link.remove();


  URL.revokeObjectURL(url);


  showNotification(
    "Backup downloaded successfully."
  );

}


/* =====================================================
   JSON RESTORE
===================================================== */

function restoreJSON(event) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const data =
          JSON.parse(
            e.target.result
          );


        let restoredProducts;


        /*
          Support our backup format:
          {
            products: [...]
          }

          Also support:
          [...]
        */

        if (
          data &&
          Array.isArray(data.products)
        ) {

          restoredProducts =
            data.products;

        }

        else if (
          Array.isArray(data)
        ) {

          restoredProducts =
            data;

        }

        else {

          throw new Error(
            "Invalid inventory backup."
          );

        }


        /* Validate */

        const valid =
          restoredProducts.every(
            product =>

              product &&

              typeof product.name ===
              "string" &&

              typeof product.sku ===
              "string" &&

              Number.isFinite(
                Number(product.price)
              ) &&

              Number.isFinite(
                Number(product.stock)
              ) &&

              Number.isFinite(
                Number(product.minimum)
              )

          );


        if (!valid) {

          throw new Error(
            "Backup contains invalid product data."
          );

        }


        /* Duplicate SKU check */

        const skus =
          restoredProducts.map(
            product =>
              product.sku
                .trim()
                .toLowerCase()
          );


        if (
          new Set(skus).size !==
          skus.length
        ) {

          throw new Error(
            "Backup contains duplicate SKUs."
          );

        }


        /* Confirmation */

        const confirmed =
          confirm(

            `Restore ${restoredProducts.length} products?\n\n` +

            `This will replace your current inventory.`

          );


        if (!confirmed) {

          event.target.value = "";

          return;

        }


        /* Clean restored data */

        products =
          restoredProducts.map(
            product => ({

              name:
                product.name.trim(),

              sku:
                product.sku.trim(),

              price:
                Number(product.price),

              stock:
                Number(product.stock),

              minimum:
                Number(product.minimum)

            })
          );


        saveProducts();

        renderProducts();


        showNotification(
          "Inventory restored successfully."
        );

      }


      catch(error) {

        alert(
          "Restore failed:\n\n" +
          error.message
        );

      }


      /*
        Reset file input so the same
        backup can be selected again.
      */

      event.target.value = "";

    };


  reader.onerror =
    function() {

      alert(
        "Could not read the backup file."
      );

      event.target.value = "";

    };


  reader.readAsText(file);

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   NOTIFICATION
===================================================== */

function showNotification(message) {

  const notification =
    document.getElementById(
      "notification"
    );


  notification.textContent =
    message;


  notification.style.display =
    "block";


  setTimeout(
    () => {

      notification.style.display =
        "none";

    },
    2500
  );

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

document
  .getElementById("productModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );


/* =====================================================
   INITIAL LOAD
===================================================== */

renderProducts();

</script>

</body>
</html>
