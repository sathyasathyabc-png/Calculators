<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#e8eaf0;font:14px Segoe UI,Arial;height:100vh;overflow:hidden}
header{height:58px;background:#171a21;border-bottom:1px solid #303644;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-size:18px;font-weight:700}.pill{font-size:11px;color:#aeb9ca;background:#28313c;border-radius:14px;padding:4px 8px;margin-left:8px}
button{background:#252b38;color:#eee;border:1px solid #3a4252;border-radius:7px;padding:9px 13px;cursor:pointer;margin-left:5px;font-weight:600}.run{background:#167b55;color:white}
.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:1px;background:#303644}
.left,.right{background:#111318;min-width:0;min-height:0;display:flex;flex-direction:column}
.bar,.head{height:44px;flex-shrink:0;background:#1b1e27;border-bottom:1px solid #303644;display:flex;align-items:center;justify-content:space-between;padding:0 13px}
.editor{flex:1;min-height:0;overflow:hidden}.CodeMirror{height:100%;font:14px/1.6 Consolas,monospace;padding:12px 0}
.right{gap:1px}.block{display:flex;flex-direction:column;min-height:0}.input{height:34%;min-height:140px}.output{flex:1}
.body{padding:12px;background:#14171e;flex:1;min-height:0;overflow:auto}textarea{width:100%;height:100%;resize:none;background:transparent;color:#eee;border:0;outline:0;font:13px/1.5 Consolas,monospace}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Consolas,monospace;margin:0;color:#dce3ef}
.status{height:27px;background:#171a21;border-top:1px solid #303644;padding:5px 12px;color:#9aa3b2;font-size:11px;display:flex;justify-content:space-between}
.ok{color:#37c98b}.err{color:#ff6b75}
@media(max-width:800px){body{height:auto;overflow:auto}.layout{height:auto;grid-template-columns:1fr}.left{height:60vh}.right{min-height:55vh}.input{height:180px}.output{min-height:220px}}
</style></head><body>
<header><div class="brand">🐍 Python Studio <span class="pill">Python 3 · Browser Runtime</span></div>
<div><button id="sample">Load sample</button><button id="clear">Clear</button><button id="download">Download .py</button><button class="run" id="run">▶ Run</button></div></header>
<main class="layout"><section class="left"><div class="bar"><b>main.py</b><small>Python source</small></div>
<div class="editor"><textarea id="code">print("Hello, Python Studio!")

name = input("Enter your name: ")
print(f"Welcome, {name}!")

numbers = [10, 20, 30, 40]
print("Total:", sum(numbers))
</textarea></div><div class="status"><span id="editstatus">Ready</span><span id="version">Loading Python runtime…</span></div></section>
<aside class="right"><section class="block input"><div class="head"><b>Program input (stdin)</b><small>One input per line</small></div><div class="body"><textarea id="stdin">Sathish</textarea></div></section>
<section class="block output"><div class="head"><b>Output</b><span id="state">Initializing…</span></div><div class="body"><pre id="output">Loading Python runtime. The first load may take a little time and requires internet access.</pre></div></section></aside></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
const editor=CodeMirror.fromTextArea(document.getElementById('code'),{mode:'python',theme:'dracula',lineNumbers:true,indentUnit:4,tabSize:4,indentWithTabs:false});
const out=document.getElementById('output'),state=document.getElementById('state'),run=document.getElementById('run');
let py=null,ready=false,busy=false;
async function init(){try{py=await loadPyodide();ready=true;document.getElementById('version').textContent='Python '+py.version;state.textContent='Ready';state.className='ok';out.textContent='Python is ready. Click Run to execute your code.'}catch(e){state.textContent='Runtime load failed';state.className='err';out.textContent='Could not load Python runtime: '+e.message}}
init();
document.getElementById('sample').onclick=()=>{editor.setValue('def describe(values):\\n    print("Values:", values)\\n    print("Count:", len(values))\\n    print("Total:", sum(values))\\n    print("Average:", sum(values) / len(values))\\n\\nnumbers = [12, 5, 8, 20, 3]\\ndescribe(numbers)\\n\\nname = input("Enter your name: ")\\nprint(f"Hello, {name}!")');document.getElementById('stdin').value='Sathish'};
document.getElementById('clear').onclick=()=>{editor.setValue('');document.getElementById('stdin').value='';out.textContent='Output cleared.';state.textContent=ready?'Ready':'Loading…'};
document.getElementById('download').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([editor.getValue()],{type:'text/x-python'}));a.href=u;a.download='main.py';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
run.onclick=async()=>{if(busy)return;if(!ready){out.textContent='Python is still loading. Please wait.';return}
busy=true;run.disabled=true;run.textContent='Running…';state.textContent='Executing';state.className='';out.textContent='Running…';
try{
py.globals.set('_user_code',editor.getValue());py.globals.set('_input_text',document.getElementById('stdin').value);
const runner=`
import sys, io, traceback, builtins
_lines = iter(_input_text.splitlines())
def _panel_input(prompt=""):
    print(prompt, end="")
    try: return next(_lines)
    except StopIteration: raise EOFError("No more input lines in stdin panel")
_oldout, _olderr, _oldinput = sys.stdout, sys.stderr, builtins.input
_capture, _errors = io.StringIO(), io.StringIO()
try:
    sys.stdout, sys.stderr, builtins.input = _capture, _errors, _panel_input
    exec(compile(_user_code, "main.py", "exec"), {"__name__":"__main__"})
except BaseException:
    traceback.print_exc(file=_errors)
finally:
    sys.stdout, sys.stderr, builtins.input = _oldout, _olderr, _oldinput
_result_text, _error_text = _capture.getvalue(), _errors.getvalue()
`;
await py.runPythonAsync(runner);
const stdout=py.globals.get('_result_text').toString(),stderr=py.globals.get('_error_text').toString();
out.textContent=(stdout||'')+(stderr?(stdout?'\\n':'')+'ERROR / TRACEBACK\\n'+stderr:'')||'Program finished with no output.';
state.textContent=stderr?'Finished with errors':'Execution complete';state.className=stderr?'err':'ok';
document.getElementById('editstatus').textContent=stderr?'Check traceback':'Run completed';
}catch(e){out.textContent='Python runtime error:\\n'+e.message;state.textContent='Execution failed';state.className='err'}
finally{busy=false;run.disabled=false;run.textContent='▶ Run'}};
editor.on('change',()=>document.getElementById('editstatus').textContent='Modified');
</script></body></html>
