<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Planner</title>

<style>
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#f1f5f9;
    --panel:#ffffff;
    --border:#dbe2ea;
    --text:#172033;
    --muted:#64748b;
    --danger:#dc2626;
    --hour-height:58px;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app-header{
    background:#172033;
    color:#fff;
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.app-header h1{
    margin:0;
    font-size:21px;
}

.header-right{
    font-size:13px;
    color:#cbd5e1;
}

.toolbar{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

button,
select,
input{
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#fff;
    color:var(--text);
    padding:8px 11px;
}

button:hover{
    background:#f8fafc;
}

.btn-primary{
    background:var(--primary);
    border-color:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-danger{
    color:var(--danger);
    border-color:#fecaca;
}

.separator{
    width:1px;
    height:30px;
    background:var(--border);
    margin:0 4px;
}

.view-buttons{
    display:flex;
}

.view-buttons button{
    border-radius:0;
}

.view-buttons button:first-child{
    border-radius:7px 0 0 7px;
}

.view-buttons button:last-child{
    border-radius:0 7px 7px 0;
    margin-left:-1px;
}

.view-buttons .active{
    background:#e8f0ff;
    color:#1d4ed8;
    border-color:#93b4ff;
}

.calendar-shell{
    margin:18px;
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 8px rgba(15,23,42,.05);
}

.calendar{
    min-width:1000px;
}

.week-grid{
    display:grid;
    grid-template-columns:190px repeat(7,minmax(150px,1fr));
}

.day-grid{
    display:grid;
    grid-template-columns:190px minmax(700px,1fr);
}

.resource-header,
.day-header{
    position:sticky;
    top:0;
    z-index:10;
    background:#f8fafc;
    border-bottom:1px solid var(--border);
}

.resource-header{
    padding:12px;
    font-weight:700;
    left:0;
    z-index:12;
}

.day-header{
    padding:10px 12px;
    border-left:1px solid var(--border);
}

.day-header strong{
    display:block;
}

.day-header small{
    color:var(--muted);
}

.resource-cell{
    min-height:85px;
    padding:12px;
    background:#fafbfc;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    position:relative;
}

.resource-name{
    font-weight:700;
}

.resource-role{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.drop-cell{
    min-height:85px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:5px;
    background:#fff;
    transition:.1s;
}

.drop-cell.today{
    background:#f4f8ff;
}

.drop-cell.drag-over{
    background:#dbeafe;
    outline:2px dashed #60a5fa;
    outline-offset:-2px;
}

.task{
    position:relative;
    color:#fff;
    border-radius:7px;
    padding:8px 9px;
    margin:3px;
    cursor:grab;
    user-select:none;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.task:active{
    cursor:grabbing;
}

.task-title{
    font-weight:700;
    font-size:12px;
}

.task-info{
    font-size:11px;
    margin-top:4px;
    opacity:.9;
}

.task-menu{
    position:absolute;
    top:4px;
    right:4px;
    border:0;
    padding:2px 5px;
    background:rgba(255,255,255,.18);
    color:#fff;
    border-radius:4px;
}

.task-menu:hover{
    background:rgba(255,255,255,.3);
}

/* Hourly day view */

.timeline{
    position:relative;
    min-height:calc(11 * var(--hour-height));
    background:
        repeating-linear-gradient(
            to bottom,
            #fff 0,
            #fff calc(var(--hour-height) - 1px),
            #e5e7eb calc(var(--hour-height) - 1px),
            #e5e7eb var(--hour-height)
        );
}

.timeline-row{
    height:var(--hour-height);
    border-bottom:1px solid #e5e7eb;
}

.time-labels{
    background:#fafbfc;
}

.time-label{
    height:var(--hour-height);
    border-bottom:1px solid #e5e7eb;
    padding:10px;
    color:var(--muted);
    font-size:12px;
    text-align:right;
}

.day-resource{
    display:grid;
    grid-template-columns:70px 1fr;
    border-bottom:1px solid var(--border);
}

.timeline-area{
    position:relative;
}

.hour-drop{
    position:absolute;
    left:0;
    right:0;
    height:var(--hour-height);
    z-index:1;
}

.hour-drop.drag-over{
    background:#dbeafe;
}

.timeline-task{
    position:absolute;
    left:8px;
    right:8px;
    z-index:3;
    color:white;
    border-radius:7px;
    padding:7px 9px;
    cursor:grab;
    overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.timeline-task .resize-handle{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:7px;
    cursor:ns-resize;
}

.timeline-task .resize-handle:hover{
    background:rgba(255,255,255,.25);
}

.expand-note{
    margin:12px 18px 0;
    color:var(--muted);
    font-size:13px;
}

/* Summary */

.summary{
    padding:0 18px 18px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.summary-card{
    background:white;
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 15px;
    min-width:150px;
}

.summary-card span{
    display:block;
    color:var(--muted);
    font-size:12px;
}

.summary-card strong{
    display:block;
    font-size:20px;
    margin-top:4px;
}

/* Modal */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.48);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:15px;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:min(540px,100%);
    background:#fff;
    border-radius:12px;
    padding:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.modal h2{
    margin:0 0 18px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:5px;
}

.form-group input,
.form-group select{
    width:100%;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.modal-footer{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.modal-footer-right{
    display:flex;
    gap:8px;
}

.empty-state{
    padding:40px;
    text-align:center;
    color:var(--muted);
}

.hidden{
    display:none!important;
}

@media(max-width:700px){
    .app-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .calendar-shell{
        margin:10px;
    }

    .summary{
        padding:0 10px 10px;
    }
}
</style>
</head>

<body>

<header class="app-header">
    <h1>Resource Planning Calendar</h1>
    <div class="header-right" id="dateLabel"></div>
</header>

<div class="toolbar">

    <button onclick="previousPeriod()">←</button>
    <button onclick="goToday()">Today</button>
    <button onclick="nextPeriod()">→</button>

    <span class="separator"></span>

    <div class="view-buttons">
        <button id="weekViewBtn" class="active" onclick="setView('week')">
            Week
        </button>
        <button id="dayViewBtn" onclick="setView('day')">
            Day / Hours
        </button>
    </div>

    <span class="separator"></span>

    <select id="resourceFilter" onchange="render()">
        <option value="all">All Resources</option>
    </select>

    <select id="projectFilter" onchange="render()">
        <option value="all">All Projects</option>
    </select>

    <button class="btn-primary" onclick="openAddModal()">
        + Assignment
    </button>

    <span class="separator"></span>

    <button onclick="exportJSON()">↓ Export JSON</button>

    <button onclick="document.getElementById('importFile').click()">
        ↑ Restore JSON
    </button>

    <input
        id="importFile"
        type="file"
        accept=".json,application/json"
        class="hidden"
        onchange="importJSON(event)"
    >

    <button class="btn-danger" onclick="resetPlanner()">
        Reset
    </button>
</div>

<div class="expand-note" id="viewNote"></div>

<div class="summary" id="summary"></div>

<div class="calendar-shell">
    <div id="calendar" class="calendar"></div>
</div>

<!-- Modal -->

<div class="modal-backdrop" id="modalBackdrop">

    <div class="modal">

        <h2 id="modalTitle">Add Assignment</h2>

        <div class="form-group">
            <label>Task</label>
            <input id="taskName" placeholder="e.g. API Development">
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Resource</label>
                <select id="taskResource"></select>
            </div>

            <div class="form-group">
                <label>Project</label>
                <input id="taskProject" placeholder="e.g. Website">
            </div>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Date</label>
                <input id="taskDate" type="date">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="taskCategory">
                    <option>Development</option>
                    <option>Design</option>
                    <option>Management</option>
                    <option>Testing</option>
                </select>
            </div>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Start Time</label>
                <input id="taskStart" type="time" value="09:00">
            </div>

            <div class="form-group">
                <label>End Time</label>
                <input id="taskEnd" type="time" value="17:00">
            </div>

        </div>

        <div class="modal-footer">

            <button
                id="deleteBtn"
                class="btn-danger"
                onclick="deleteTask()"
                style="display:none">
                Delete
            </button>

            <div class="modal-footer-right">
                <button onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveTask()">
                    Save
                </button>
            </div>

        </div>

    </div>
</div>

<script>

/* ============================================================
   DATA
============================================================ */

const DEFAULT_DATA = {
    version:1,

    resources:[
        {id:1,name:"John Smith",role:"Developer"},
        {id:2,name:"Sarah Lee",role:"UI/UX Designer"},
        {id:3,name:"Mike Brown",role:"Project Manager"},
        {id:4,name:"Priya Kumar",role:"QA Engineer"},
        {id:5,name:"David Wilson",role:"Developer"}
    ],

    assignments:[],

    settings:{
        workStart:8,
        workEnd:18
    }
};

const COLORS = {
    Development:"#2563eb",
    Design:"#16a34a",
    Management:"#9333ea",
    Testing:"#ea580c"
};

let data = loadData();

let currentDate = new Date();

let view = "week";

let editingId = null;

let dragId = null;

let resizing = null;


/* ============================================================
   DATA STORAGE
============================================================ */

function clone(obj){
    return JSON.parse(JSON.stringify(obj));
}

function loadData(){

    try{

        const saved =
            localStorage.getItem("resourcePlannerData");

        if(saved){

            const parsed = JSON.parse(saved);

            return normalizeData(parsed);
        }

    }catch(error){

        console.error("Could not load saved data",error);

    }

    const fresh = clone(DEFAULT_DATA);

    createSampleData(fresh);

    return fresh;
}

function normalizeData(input){

    const result = clone(DEFAULT_DATA);

    if(input && Array.isArray(input.resources))
        result.resources = input.resources;

    if(input && Array.isArray(input.assignments))
        result.assignments = input.assignments;

    if(input && input.settings)
        result.settings = {
            ...result.settings,
            ...input.settings
        };

    return result;
}

function saveData(){

    localStorage.setItem(
        "resourcePlannerData",
        JSON.stringify(data)
    );
}

function createSampleData(target){

    const today = dateString(new Date());

    target.assignments = [
        {
            id:Date.now()+1,
            name:"API Development",
            resourceId:1,
            project:"Website Redesign",
            date:today,
            start:"09:00",
            end:"13:00",
            category:"Development"
        },
        {
            id:Date.now()+2,
            name:"Homepage Design",
            resourceId:2,
            project:"Website Redesign",
            date:today,
            start:"10:00",
            end:"16:00",
            category:"Design"
        },
        {
            id:Date.now()+3,
            name:"Sprint Planning",
            resourceId:3,
            project:"Mobile App",
            date:dateString(addDays(new Date(),1)),
            start:"09:00",
            end:"11:00",
            category:"Management"
        },
        {
            id:Date.now()+4,
            name:"Regression Testing",
            resourceId:4,
            project:"Mobile App",
            date:dateString(addDays(new Date(),2)),
            start:"13:00",
            end:"17:00",
            category:"Testing"
        }
    ];
}


/* ============================================================
   DATE HELPERS
============================================================ */

function dateString(date){

    const d = new Date(date);

    const y = d.getFullYear();

    const m = String(d.getMonth()+1).padStart(2,"0");

    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
}

function parseDate(value){

    const [y,m,d] = value.split("-").map(Number);

    return new Date(y,m-1,d);
}

function addDays(date,amount){

    const d = new Date(date);

    d.setDate(d.getDate()+amount);

    return d;
}

function startOfWeek(date){

    const d = new Date(date);

    d.setHours(0,0,0,0);

    d.setDate(d.getDate()-d.getDay());

    return d;
}

function formatShort(date){

    return date.toLocaleDateString(
        undefined,
        {
            month:"short",
            day:"numeric"
        }
    );
}

function formatFull(date){

    return date.toLocaleDateString(
        undefined,
        {
            weekday:"long",
            month:"long",
            day:"numeric",
            year:"numeric"
        }
    );
}

function minutes(time){

    const [h,m] = time.split(":").map(Number);

    return h*60+m;
}

function timeString(total){

    let h = Math.floor(total/60);

    let m = total%60;

    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}


/* ============================================================
   FILTERS
============================================================ */

function populateFilters(){

    const rf =
        document.getElementById("resourceFilter");

    const pf =
        document.getElementById("projectFilter");

    const oldResource = rf.value || "all";

    const oldProject = pf.value || "all";

    rf.innerHTML =
        `<option value="all">All Resources</option>`;

    data.resources.forEach(resource=>{

        rf.innerHTML += `
            <option value="${resource.id}">
                ${escapeHtml(resource.name)}
            </option>
        `;

    });

    rf.value =
        [...rf.options].some(o=>o.value===oldResource)
        ? oldResource
        : "all";

    const projects =
        [...new Set(
            data.assignments
                .map(a=>a.project)
                .filter(Boolean)
        )].sort();

    pf.innerHTML =
        `<option value="all">All Projects</option>`;

    projects.forEach(project=>{

        const option =
            document.createElement("option");

        option.value = project;

        option.textContent = project;

        pf.appendChild(option);

    });

    pf.value =
        [...pf.options].some(o=>o.value===oldProject)
        ? oldProject
        : "all";
}

function filteredResources(){

    const value =
        document.getElementById("resourceFilter").value;

    return data.resources.filter(r=>
        value==="all" ||
        String(r.id)===String(value)
    );
}

function filteredAssignments(){

    const project =
        document.getElementById("projectFilter").value;

    const resource =
        document.getElementById("resourceFilter").value;

    return data.assignments.filter(a=>
        (project==="all" || a.project===project) &&
        (resource==="all" ||
         String(a.resourceId)===String(resource))
    );
}


/* ============================================================
   RENDER
============================================================ */

function render(){

    populateFilters();

    renderSummary();

    if(view==="week")
        renderWeek();
    else
        renderDay();

    updateHeader();
}

function updateHeader(){

    const label =
        document.getElementById("dateLabel");

    if(view==="week"){

        const start = startOfWeek(currentDate);

        const end = addDays(start,6);

        label.textContent =
            `${formatShort(start)} – ${formatShort(end)}`;

    }else{

        label.textContent =
            formatFull(currentDate);

    }

    document.getElementById("weekViewBtn")
        .classList.toggle("active",view==="week");

    document.getElementById("dayViewBtn")
        .classList.toggle("active",view==="day");

    document.getElementById("viewNote").textContent =
        view==="week"
        ? "Drag assignments to another resource or day. Switch to Day / Hours to expand a day into hourly planning."
        : "Hourly view: drag assignments to change start time/resource. Drag the bottom edge to resize duration.";
}

function renderSummary(){

    const assignments =
        filteredAssignments();

    const hours =
        assignments.reduce((sum,a)=>
            sum + Math.max(
                0,
                (minutes(a.end)-minutes(a.start))/60
            ),0);

    const resources =
        new Set(assignments.map(a=>a.resourceId)).size;

    document.getElementById("summary").innerHTML = `
        <div class="summary-card">
            <span>Assignments</span>
            <strong>${assignments.length}</strong>
        </div>

        <div class="summary-card">
            <span>Resources Used</span>
            <strong>${resources}</strong>
        </div>

        <div class="summary-card">
            <span>Planned Hours</span>
            <strong>${hours.toFixed(1)}</strong>
        </div>
    `;
}


/* ============================================================
   WEEK VIEW
============================================================ */

function renderWeek(){

    const calendar =
        document.getElementById("calendar");

    const dates =
        Array.from(
            {length:7},
            (_,i)=>addDays(startOfWeek(currentDate),i)
        );

    const resources =
        filteredResources();

    const assignments =
        filteredAssignments();

    calendar.innerHTML = "";

    const grid =
        document.createElement("div");

    grid.className = "week-grid";

    grid.innerHTML = `
        <div class="resource-header">
            Resource
        </div>
    `;

    dates.forEach(date=>{

        const header =
            document.createElement("div");

        header.className =
            "day-header";

        if(dateString(date)===dateString(new Date()))
            header.style.background="#eff6ff";

        header.innerHTML = `
            <strong>
                ${date.toLocaleDateString(
                    undefined,{weekday:"short"}
                )}
            </strong>
            <small>${formatShort(date)}</small>
        `;

        header.addEventListener(
            "dblclick",
            ()=>{
                currentDate = date;
                view = "day";
                render();
            }
        );

        grid.appendChild(header);

    });

    resources.forEach(resource=>{

        const resourceCell =
            document.createElement("div");

        resourceCell.className =
            "resource-cell";

        resourceCell.innerHTML = `
            <div class="resource-name">
                ${escapeHtml(resource.name)}
            </div>
            <span class="resource-role">
                ${escapeHtml(resource.role || "")}
            </span>
        `;

        grid.appendChild(resourceCell);

        dates.forEach(date=>{

            const cell =
                document.createElement("div");

            cell.className = "drop-cell";

            const dateValue =
                dateString(date);

            if(dateValue===dateString(new Date()))
                cell.classList.add("today");

            cell.dataset.resourceId =
                resource.id;

            cell.dataset.date =
                dateValue;

            cell.addEventListener(
                "dragover",
                e=>{
                    e.preventDefault();
                    cell.classList.add("drag-over");
                }
            );

            cell.addEventListener(
                "dragleave",
                ()=>{
                    cell.classList.remove("drag-over");
                }
            );

            cell.addEventListener(
                "drop",
                e=>{
                    e.preventDefault();

                    cell.classList.remove("drag-over");

                    moveTask(
                        dragId,
                        resource.id,
                        dateValue
                    );
                }
            );

            const dayTasks =
                assignments.filter(a=>
                    Number(a.resourceId)===Number(resource.id) &&
                    a.date===dateValue
                );

            dayTasks.forEach(task=>{
                cell.appendChild(
                    createTaskElement(task)
                );
            });

            cell.addEventListener(
                "dblclick",
                e=>{
                    if(e.target===cell){
                        openAddModal(
                            dateValue,
                            resource.id
                        );
                    }
                }
            );

            grid.appendChild(cell);

        });

    });

    calendar.appendChild(grid);
}


/* ============================================================
   DAY / HOURLY VIEW
============================================================ */

function renderDay(){

    const calendar =
        document.getElementById("calendar");

    const resources =
        filteredResources();

    const assignments =
        filteredAssignments();

    const startHour =
        Number(data.settings.workStart);

    const endHour =
        Number(data.settings.workEnd);

    const totalHours =
        endHour-startHour;

    calendar.innerHTML = "";

    const header =
        document.createElement("div");

    header.className = "day-grid";

    header.innerHTML = `
        <div class="resource-header">
            Resource
        </div>

        <div class="day-header">
            <strong>${formatFull(currentDate)}</strong>
            <small>
                ${startHour}:00 – ${endHour}:00
            </small>
        </div>
    `;

    calendar.appendChild(header);

    resources.forEach(resource=>{

        const row =
            document.createElement("div");

        row.className =
            "day-resource";

        const label =
            document.createElement("div");

        label.className =
            "resource-cell";

        label.innerHTML = `
            <div class="resource-name">
                ${escapeHtml(resource.name)}
            </div>
            <span class="resource-role">
                ${escapeHtml(resource.role || "")}
            </span>
        `;

        row.appendChild(label);

        const timelineArea =
            document.createElement("div");

        timelineArea.className =
            "timeline-area";

        timelineArea.style.height =
            `${totalHours*58}px`;

        const timeline =
            document.createElement("div");

        timeline.className = "timeline";

        timeline.style.height =
            `${totalHours*58}px`;

        /*
          Hour drop zones
        */

        for(let hour=startHour;hour<endHour;hour++){

            const zone =
                document.createElement("div");

            zone.className = "hour-drop";

            zone.style.top =
                `${(hour-startHour)*58}px`;

            zone.dataset.hour = hour;

            zone.addEventListener(
                "dragover",
                e=>{
                    e.preventDefault();
                    zone.classList.add("drag-over");
                }
            );

            zone.addEventListener(
                "dragleave",
                ()=>{
                    zone.classList.remove("drag-over");
                }
            );

            zone.addEventListener(
                "drop",
                e=>{
                    e.preventDefault();

                    zone.classList.remove("drag-over");

                    moveTaskToHour(
                        dragId,
                        resource.id,
                        hour
                    );
                }
            );

            timeline.appendChild(zone);
        }

        const resourceTasks =
            assignments.filter(a=>
                Number(a.resourceId)===Number(resource.id) &&
                a.date===dateString(currentDate)
            );

        resourceTasks.forEach(task=>{

            const taskElement =
                createTimelineTask(
                    task,
                    startHour
                );

            timeline.appendChild(taskElement);

        });

        timelineArea.appendChild(timeline);

        row.appendChild(timelineArea);

        calendar.appendChild(row);

    });
}


/* ============================================================
   TASK ELEMENTS
============================================================ */

function createTaskElement(task){

    const el =
        document.createElement("div");

    el.className = "task";

    el.draggable = true;

    el.style.background =
        COLORS[task.category] || COLORS.Development;

    el.dataset.id = task.id;

    el.innerHTML = `
        <div class="task-title">
            ${escapeHtml(task.name)}
        </div>

        <div class="task-info">
            ${escapeHtml(task.project)}
            · ${escapeHtml(task.start)}–${escapeHtml(task.end)}
        </div>

        <button class="task-menu">⋮</button>
    `;

    el.addEventListener(
        "dragstart",
        e=>{
            dragId = task.id;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData(
                "text/plain",
                String(task.id)
            );
        }
    );

    el.addEventListener(
        "dragend",
        ()=>{
            dragId = null;
        }
    );

    el.querySelector(".task-menu")
        .addEventListener(
            "click",
            e=>{
                e.stopPropagation();
                openEditModal(task.id);
            }
        );

    el.addEventListener(
        "dblclick",
        e=>{
            e.stopPropagation();
            openEditModal(task.id);
        }
    );

    return el;
}

function createTimelineTask(task,startHour){

    const el =
        document.createElement("div");

    el.className =
        "timeline-task";

    el.draggable = true;

    el.style.background =
        COLORS[task.category] || COLORS.Development;

    const start =
        minutes(task.start);

    const end =
        minutes(task.end);

    const top =
        ((start-startHour*60)/60)*58;

    const height =
        Math.max(
            25,
            ((end-start)/60)*58
        );

    el.style.top = `${top}px`;

    el.style.height = `${height}px`;

    el.innerHTML = `
        <div class="task-title">
            ${escapeHtml(task.name)}
        </div>

        <div class="task-info">
            ${escapeHtml(task.project)}
            · ${escapeHtml(task.start)}–${escapeHtml(task.end)}
        </div>

        <div class="resize-handle"></div>
    `;

    el.addEventListener(
        "dragstart",
        e=>{
            dragId = task.id;

            e.dataTransfer.effectAllowed="move";

            e.dataTransfer.setData(
                "text/plain",
                String(task.id)
            );
        }
    );

    el.addEventListener(
        "dragend",
        ()=>{
            dragId=null;
        }
    );

    el.addEventListener(
        "dblclick",
        e=>{
            e.stopPropagation();
            openEditModal(task.id);
        }
    );

    /*
      Resize task vertically
    */

    const handle =
        el.querySelector(".resize-handle");

    handle.addEventListener(
        "mousedown",
        e=>{
            e.preventDefault();
            e.stopPropagation();

            resizing = {
                id:task.id,
                startY:e.clientY,
                originalEnd:minutes(task.end)
            };

            document.body.style.userSelect="none";

            document.addEventListener(
                "mousemove",
                resizeMove
            );

            document.addEventListener(
                "mouseup",
                resizeEnd
            );
        }
    );

    return el;
}

function resizeMove(e){

    if(!resizing)
        return;

    const task =
        data.assignments.find(
            a=>a.id===resizing.id
        );

    if(!task)
        return;

    const diffPixels =
        e.clientY-resizing.startY;

    const diffMinutes =
        Math.round(
            (diffPixels/58)*60/15
        )*15;

    let newEnd =
        resizing.originalEnd+diffMinutes;

    const start =
        minutes(task.start);

    newEnd =
        Math.max(
            start+15,
            Math.min(
                data.settings.workEnd*60,
                newEnd
            )
        );

    task.end =
        timeString(newEnd);

    saveData();

    render();
}

function resizeEnd(){

    resizing=null;

    document.body.style.userSelect="";

    document.removeEventListener(
        "mousemove",
        resizeMove
    );

    document.removeEventListener(
        "mouseup",
        resizeEnd
    );
}


/* ============================================================
   DRAG / DROP
============================================================ */

function moveTask(id,resourceId,date){

    const task =
        data.assignments.find(
            a=>Number(a.id)===Number(id)
        );

    if(!task)
        return;

    task.resourceId =
        Number(resourceId);

    task.date = date;

    saveData();

    render();
}

function moveTaskToHour(id,resourceId,hour){

    const task =
        data.assignments.find(
            a=>Number(a.id)===Number(id)
        );

    if(!task)
        return;

    const duration =
        Math.max(
            15,
            minutes(task.end)-minutes(task.start)
        );

    const newStart =
        hour*60;

    let newEnd =
        newStart+duration;

    if(newEnd > data.settings.workEnd*60){

        newEnd =
            data.settings.workEnd*60;
    }

    task.resourceId =
        Number(resourceId);

    task.date =
        dateString(currentDate);

    task.start =
        timeString(newStart);

    task.end =
        timeString(
            Math.max(
                newStart+15,
                newEnd
            )
        );

    saveData();

    render();
}


/* ============================================================
   MODAL
============================================================ */

function populateTaskResources(){

    const select =
        document.getElementById("taskResource");

    select.innerHTML = "";

    data.resources.forEach(resource=>{

        select.innerHTML += `
            <option value="${resource.id}">
                ${escapeHtml(resource.name)}
            </option>
        `;

    });
}

function openAddModal(date=null,resourceId=null){

    editingId=null;

    populateTaskResources();

    document.getElementById("modalTitle")
        .textContent="Add Assignment";

    document.getElementById("deleteBtn")
        .style.display="none";

    document.getElementById("taskName").value="";

    document.getElementById("taskProject").value="";

    document.getElementById("taskDate").value =
        date || dateString(currentDate);

    document.getElementById("taskStart").value="09:00";

    document.getElementById("taskEnd").value="17:00";

    document.getElementById("taskCategory")
        .value="Development";

    if(resourceId!==null){

        document.getElementById("taskResource")
            .value=String(resourceId);

    }

    document.getElementById("modalBackdrop")
        .classList.add("show");
}

function openEditModal(id){

    const task =
        data.assignments.find(
            a=>Number(a.id)===Number(id)
        );

    if(!task)
        return;

    editingId=id;

    populateTaskResources();

    document.getElementById("modalTitle")
        .textContent="Edit Assignment";

    document.getElementById("deleteBtn")
        .style.display="block";

    document.getElementById("taskName").value =
        task.name;

    document.getElementById("taskResource").value =
        task.resourceId;

    document.getElementById("taskProject").value =
        task.project;

    document.getElementById("taskDate").value =
        task.date;

    document.getElementById("taskStart").value =
        task.start;

    document.getElementById("taskEnd").value =
        task.end;

    document.getElementById("taskCategory").value =
        task.category;

    document.getElementById("modalBackdrop")
        .classList.add("show");
}

function closeModal(){

    document.getElementById("modalBackdrop")
        .classList.remove("show");

    editingId=null;
}

function saveTask(){

    const name =
        document.getElementById("taskName")
            .value.trim();

    const resourceId =
        Number(
            document.getElementById("taskResource")
                .value
        );

    const project =
        document.getElementById("taskProject")
            .value.trim();

    const date =
        document.getElementById("taskDate").value;

    const start =
        document.getElementById("taskStart").value;

    const end =
        document.getElementById("taskEnd").value;

    const category =
        document.getElementById("taskCategory").value;

    if(!name || !project || !date || !start || !end){

        alert("Please complete all fields.");

        return;
    }

    if(minutes(end)<=minutes(start)){

        alert("End time must be after start time.");

        return;
    }

    if(editingId!==null){

        const task =
            data.assignments.find(
                a=>Number(a.id)===Number(editingId)
            );

        if(task){

            Object.assign(
                task,
                {
                    name,
                    resourceId,
                    project,
                    date,
                    start,
                    end,
                    category
                }
            );
        }

    }else{

        data.assignments.push({

            id:Date.now(),

            name,

            resourceId,

            project,

            date,

            start,

            end,

            category

        });

    }

    saveData();

    closeModal();

    render();
}

function deleteTask(){

    if(editingId===null)
        return;

    const task =
        data.assignments.find(
            a=>Number(a.id)===Number(editingId)
        );

    if(!task)
        return;

    if(!confirm(
        `Delete "${task.name}"?`
    ))
        return;

    data.assignments =
        data.assignments.filter(
            a=>Number(a.id)!==Number(editingId)
        );

    saveData();

    closeModal();

    render();
}


/* ============================================================
   NAVIGATION
============================================================ */

function setView(next){

    view=next;

    render();
}

function previousPeriod(){

    currentDate =
        addDays(
            currentDate,
            view==="week" ? -7 : -1
        );

    render();
}

function nextPeriod(){

    currentDate =
        addDays(
            currentDate,
            view==="week" ? 7 : 1
        );

    render();
}

function goToday(){

    currentDate=new Date();

    render();
}


/* ============================================================
   JSON EXPORT
============================================================ */

function exportJSON(){

    const backup = {

        ...clone(data),

        exportedAt:
            new Date().toISOString()

    };

    const json =
        JSON.stringify(
            backup,
            null,
            2
        );

    const blob =
        new Blob(
            [json],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    const stamp =
        dateString(new Date());

    a.href=url;

    a.download =
        `resource-planner-${stamp}.json`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* ============================================================
   JSON IMPORT / RESTORE
============================================================ */

function importJSON(event){

    const file =
        event.target.files[0];

    if(!file)
        return;

    const reader =
        new FileReader();

    reader.onload = function(e){

        try{

            const imported =
                JSON.parse(e.target.result);

            if(
                !imported ||
                !Array.isArray(imported.resources) ||
                !Array.isArray(imported.assignments)
            ){

                throw new Error(
                    "Invalid resource planner backup."
                );
            }

            const restored =
                normalizeData(imported);

            const confirmed =
                confirm(
                    `Restore backup containing ` +
                    `${restored.resources.length} resources and ` +
                    `${restored.assignments.length} assignments?`
                );

            if(!confirmed)
                return;

            data=restored;

            saveData();

            render();

            alert("Backup restored successfully.");

        }catch(error){

            alert(
                "Could not restore this file.\n\n" +
                error.message
            );

        }finally{

            event.target.value="";

        }
    };

    reader.readAsText(file);
}


/* ============================================================
   RESET
============================================================ */

function resetPlanner(){

    if(!confirm(
        "Reset the planner to its original sample data?"
    ))
        return;

    data =
        clone(DEFAULT_DATA);

    createSampleData(data);

    saveData();

    render();
}


/* ============================================================
   UTILITY
============================================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.getElementById("modalBackdrop")
    .addEventListener(
        "click",
        e=>{
            if(
                e.target.id==="modalBackdrop"
            ){
                closeModal();
            }
        }
    );

document.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Escape")
            closeModal();
    }
);


/* ============================================================
   INITIALIZE
============================================================ */

render();

</script>
