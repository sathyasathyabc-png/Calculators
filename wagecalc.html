<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Item Calculator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px 15px;
        color: #222;
    }

    .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 25px;
    }

    .header-fields {
        display: grid;
        grid-template-columns: 1fr 200px;
        gap: 15px;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 8px;
    }

    th {
        background: #f0f2f4;
        text-align: left;
    }

    .number {
        width: 180px;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
    }

    .delete-btn:hover {
        background: #b02a37;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    button {
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
    }

    .add-btn {
        background: #198754;
        color: white;
    }

    .print-btn {
        background: #0d6efd;
        color: white;
    }

    .total {
        text-align: right;
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 2px solid #222;
    }

    @media (max-width: 600px) {
        .header-fields {
            grid-template-columns: 1fr;
        }

        .number {
            width: auto;
        }

        th:nth-child(3),
        td:nth-child(3) {
            display: none;
        }
    }

    @media print {
        body {
            background: white;
            padding: 0;
        }

        .container {
            box-shadow: none;
            max-width: none;
            padding: 10px;
        }

        .buttons,
        .delete-column {
            display: none;
        }

        input {
            border: none;
            padding: 5px;
        }

        h1 {
            margin-bottom: 15px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Wages/Items Calculator</h1>

    <div class="header-fields">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter name">
        </div>

        <div>
            <label for="date">Date</label>
            <input type="date" id="date">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Particulars</th>
                <th class="number">Amount</th>
                <th class="delete-column">Action</th>
            </tr>
        </thead>

        <tbody id="itemTable">
            <tr>
                <td>
                    <input type="text" placeholder="Enter item">
                </td>
                <td>
                    <input type="number"
                           class="item-value"
                           value="0"
                           step="any"
                           oninput="calculateTotal()">
                </td>
                <td class="delete-column">
                    <button class="delete-btn" onclick="removeItem(this)">
                        Remove
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="buttons">
        <button class="add-btn" onclick="addItem()">
            + Add Item
        </button>

        <button class="print-btn" onclick="window.print()">
            🖨 Print
        </button>
    </div>

    <div class="total">
        Total: <span id="total">0</span>
    </div>

</div>

<script>
    // Set today's date
    document.getElementById("date").value =
        new Date().toISOString().split("T")[0];

    function addItem() {
        const table = document.getElementById("itemTable");

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>
                <input type="text" placeholder="Enter item">
            </td>

            <td>
                <input type="number"
                       class="item-value"
                       value="0"
                       step="any"
                       oninput="calculateTotal()">
            </td>

            <td class="delete-column">
                <button class="delete-btn" onclick="removeItem(this)">
                    Remove
                </button>
            </td>
        `;

        table.appendChild(row);
    }

    function removeItem(button) {
        button.closest("tr").remove();
        calculateTotal();
    }

    function calculateTotal() {
        const values = document.querySelectorAll(".item-value");

        let total = 0;

        values.forEach(input => {
            total += parseFloat(input.value) || 0;
        });

        document.getElementById("total").textContent =
            Number.isInteger(total)
                ? total
                : total.toFixed(2);
    }
</script>

</body>
</html>
